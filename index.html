<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ຄັງເສື້ອຜ້າ - ຈັດການສະຕັອກ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2B33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ຄັງເສື້ອຜ້າ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF; --dark:#1C2B33; --accent:#E8A33D; --danger:#B94A3D; --success:#4C7A5E;
    --dark-5:rgba(28,43,51,.05); --dark-8:rgba(28,43,51,.08); --dark-10:rgba(28,43,51,.10);
    --dark-15:rgba(28,43,51,.15); --dark-40:rgba(28,43,51,.40); --dark-50:rgba(28,43,51,.50);
    --dark-60:rgba(28,43,51,.60); --danger-10:rgba(185,74,61,.10); --success-10:rgba(76,122,94,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#E7E3D8; font-family:'Noto Sans Lao','Noto Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--dark);
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:96px; box-shadow:0 0 40px rgba(0,0,0,.06);}
  .header{background:var(--dark); color:#fff; padding:28px 20px 20px; border-radius:0 0 24px 24px; box-shadow:0 4px 14px rgba(0,0,0,.15); background-size:cover; background-position:center; transition:background .2s;}
  .header-top{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .logo{width:36px; height:36px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--dark); overflow:hidden;}
  .logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .header h1{font-size:18px; font-weight:700; margin:0; line-height:1.2;}
  .header p{font-size:11px; color:rgba(255,255,255,.6); margin:2px 0 0;}
  .header-actions{display:flex; gap:8px; margin-left:auto; flex-shrink:0;}
  .header-icon-btn{width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.12); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex-shrink:0;}
  .header-icon-btn svg{width:17px; height:17px;}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .stat{background:rgba(255,255,255,.1); border-radius:12px; padding:8px 6px; text-align:center;}
  .stat.warn{background:var(--accent);}
  .stat-label{font-size:10px; color:rgba(255,255,255,.6);}
  .stat.warn .stat-label{color:rgba(28,43,51,.7);}
  .stat-value{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat.warn .stat-value{color:var(--dark);}
  .tabs{display:flex; gap:8px; padding:16px 20px 0;}
  .tab-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:10px 4px; border-radius:12px; font-size:12.5px; font-weight:600; border:1px solid var(--dark-10); background:#fff; color:var(--dark-60); cursor:pointer; white-space:nowrap;}
  .tab-btn.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .tab-btn svg{width:16px; height:16px;}
  .content{padding:16px 20px 0;}
  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dark-40);}
  .search-wrap input{width:100%; background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:10px 40px 10px 34px; font-size:14px; outline:none; font-family:inherit;}
  .search-scan-btn{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:8px; background:var(--dark-5); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .search-scan-btn svg{width:14px; height:14px; color:var(--dark-60);}
  .search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,163,61,.25);}
  .search-row{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .search-row .search-wrap{flex:1; margin-bottom:0;}
  .view-toggle{display:flex; gap:6px; flex-shrink:0;}
  .view-btn{width:38px; height:38px; border-radius:12px; border:1px solid var(--dark-10); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--dark-60);}
  .view-btn.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .view-btn svg{width:16px; height:16px;}
  .grid-container{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid-card{background:#fff; border-radius:16px; border:1px solid var(--dark-8); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; text-align:left; cursor:pointer; padding:0; font-family:inherit; display:block; width:100%; position:relative;}
  .grid-img{width:100%; aspect-ratio:1/1; background:var(--dark-5); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:pointer;}
  .grid-img img{width:100%; height:100%; object-fit:cover;}
  .grid-img svg{width:24px; height:24px; color:var(--dark-15);}
  .grid-low-badge{position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--danger); display:flex; align-items:center; justify-content:center;}
  .buy-btn, .sell-btn{background:var(--success); color:#fff; border:none; border-radius:999px; padding:8px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 3px 10px rgba(0,0,0,.28); display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .buy-btn{background:var(--accent); color:var(--dark);}
  .buy-btn svg, .sell-btn svg{width:14px; height:14px;}
  .sell-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--dark-5);}
  .sell-row:last-child{border-bottom:none;}
  .sell-row-info{display:flex; flex-direction:column; gap:1px;}
  .sell-size{font-size:13px; font-weight:600; color:var(--dark);}
  .sell-qty-input{width:68px; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:14px; text-align:center; outline:none; font-family:inherit;}
  .sell-qty-input:focus{border-color:var(--success); box-shadow:0 0 0 3px rgba(76,122,94,.2);}
  .grid-low-badge svg{width:11px; height:11px; color:#fff;}
  .grid-body{padding:10px 10px 40px; cursor:pointer;}
  .grid-title{font-size:13px; font-weight:600; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grid-sub{font-size:10px; color:var(--dark-40); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grid-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; min-height:18px;}
  .grid-qty-badge{position:absolute; right:8px; bottom:8px; background:var(--accent); color:var(--dark); font-weight:700; font-size:13px; font-family:monospace; padding:4px 12px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.18); display:flex; align-items:baseline; gap:3px; z-index:2;}
  .grid-qty-badge small{font-family:'Noto Sans Lao','Noto Sans',system-ui,sans-serif; font-weight:600; font-size:10px;}
  .icon-btn-sm{width:32px; height:32px; border-radius:10px; background:var(--danger-10); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .icon-btn-sm svg{width:14px; height:14px; color:var(--danger);}
  .detail-img{width:100%; aspect-ratio:1/1; max-height:260px; border-radius:16px; background:var(--dark-5); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .detail-img img{width:100%; height:100%; object-fit:cover;}
  .detail-img svg{width:40px; height:40px; color:var(--dark-15);}
  .empty{text-align:center; padding:60px 0;}
  .empty svg{width:36px; height:36px; color:var(--dark-15); margin-bottom:8px;}
  .empty p{font-size:13px; color:var(--dark-50); margin:0;}
  .card{position:relative; background:#fff; border-radius:16px; border:1px solid var(--dark-8); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; margin-bottom:10px;}
  .card-strip{position:absolute; left:0; top:0; bottom:0; width:6px;}
  .card-row{padding:12px 12px 12px 16px; display:flex; align-items:center; gap:12px;}
  .thumb{width:56px; height:56px; border-radius:12px; background:var(--dark-5); overflow:hidden; flex-shrink:0; border:none; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb svg{width:20px; height:20px; color:var(--dark-15);}
  .card-main{flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; cursor:pointer; font-family:inherit;}
  .card-title{display:flex; align-items:center; gap:6px;}
  .card-title span{font-weight:600; font-size:14px; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-title svg{width:13px; height:13px; color:var(--danger); flex-shrink:0;}
  .card-sub{font-size:11px; color:var(--dark-40); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .tag{font-size:10px; font-weight:600; font-family:monospace; padding:2px 6px; border-radius:6px; background:var(--success-10); color:var(--success);}
  .tag.low{background:var(--danger-10); color:var(--danger);}
  .card-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  .card-total{font-family:monospace; font-weight:700; font-size:18px; color:var(--dark);}
  .chevron-btn{background:none; border:none; cursor:pointer; padding:2px;}
  .chevron-btn svg{width:16px; height:16px; color:var(--dark-40); transition:transform .2s;}
  .chevron-btn.open svg{transform:rotate(180deg);}
  .expand-panel{padding:2px 16px 12px; border-top:1px solid var(--dark-5);}
  .variant-row{display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:6px 10px; margin-top:6px;}
  .variant-size{font-size:12px; font-weight:600; width:56px;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .step-btn{width:24px; height:24px; border-radius:6px; background:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .step-btn svg{width:12px; height:12px; color:var(--dark);}
  .step-val{font-family:monospace; font-size:13px; width:22px; text-align:center;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .row-actions button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; border-radius:10px; font-size:12px; font-weight:600; border:none; cursor:pointer; font-family:inherit;}
  .row-actions button svg{width:12px; height:12px;}
  .btn-edit{background:var(--dark); color:#fff;}
  .btn-del{background:var(--danger); color:#fff;}
  .report-card{background:#fff; border-radius:16px; border:1px solid var(--dark-8); padding:16px; margin-bottom:12px; overflow:hidden;}
  .report-label{font-size:12px; color:var(--dark-50); margin:0 0 4px;}
  .report-value{font-size:24px; font-weight:700; font-family:monospace; margin:0;}
  .report-value small{font-size:13px; font-weight:400; color:var(--dark-50); font-family:inherit;}
  .report-sub{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--dark-60);}
  .report-head{display:flex; align-items:center; gap:6px; margin-bottom:12px;}
  .report-card-header{margin:-16px -16px 12px; padding:13px 16px; border-radius:15px 15px 0 0; background:var(--dark); display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; row-gap:8px;}
  .report-card-header .report-head{margin-bottom:0; color:#fff; font-weight:600; font-size:14px;}
  .report-card-header .report-head svg{color:var(--accent);}
  .report-card-header p{color:#fff; margin:0; font-size:14px; font-weight:600;}
  .report-card-header .pdf-btn{background:rgba(255,255,255,.15); color:#fff;}
  .report-card-header .header-select{background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:4px 4px; font-size:10px; font-weight:600; font-family:inherit; outline:none; max-width:78px; flex-shrink:1;}
  .report-card-header .header-select option{color:var(--dark);}
  .report-card-header-row{display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto;}
  .report-card-header-row span{color:#fff; font-weight:600; font-size:14px; white-space:nowrap; flex-shrink:0;}
  .report-head svg{width:15px; height:15px; color:var(--danger);}
  .report-head span{font-size:14px; font-weight:600;}
  .low-item, .stock-item{display:flex; align-items:center; justify-content:space-between; font-size:13px; border-bottom:1px solid var(--dark-5); padding:8px 0;}
  .low-item:last-child, .stock-item:last-child{border-bottom:none; padding-bottom:0;}
  .muted{color:var(--dark-40); font-size:11px;}
  .fab, .fab-manage{position:fixed; bottom:24px; width:56px; height:56px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.25); transition:left .45s cubic-bezier(.34,1.3,.64,1), right .45s cubic-bezier(.34,1.3,.64,1), transform .45s cubic-bezier(.34,1.3,.64,1), box-shadow .3s ease;}
  .fab{left:50%; transform:translateX(-50%); background:var(--accent); z-index:16;}
  .fab.fab-report{background:#9AC93B;}
  .fab-manage{left:50%; right:auto; transform:translateX(-50%) translate(6px,4px) scale(.92); background:var(--danger); z-index:15; display:none;}
  .fab-manage.show{display:flex;}
  .fab-anchor.expanded .fab{left:24px; transform:none;}
  .fab-anchor.expanded .fab-manage{left:auto; right:24px; transform:none;}
  @keyframes fabIdleGlow{
    0%, 100%{ box-shadow:0 6px 16px rgba(0,0,0,.25); }
    50%{ box-shadow:0 9px 22px rgba(0,0,0,.35); }
  }
  .fab-anchor:not(.expanded) .fab.fab-report{ animation:fabIdleGlow 2s ease-in-out infinite; }
  .fab.fab-report:active, .fab-manage.show:active{ filter:brightness(.9); }
  .fab-manage svg{width:20px; height:20px; color:#fff;}
  .fab-label{position:fixed; left:-48px; bottom:24px; pointer-events:none; z-index:14; display:none; opacity:0; transition:opacity .25s ease;}
  .fab-manage-label{position:fixed; right:-48px; left:auto; bottom:24px; pointer-events:none; z-index:14; display:none; opacity:0; transition:opacity .25s ease;}
  .fab-label.show, .fab-manage-label.show{display:block;}
  .fab-anchor.expanded .fab-label.show, .fab-anchor.expanded .fab-manage-label.show{opacity:1; transition-delay:.2s;}
  .fab svg{width:26px; height:26px; color:var(--dark);}
  .fab-anchor{max-width:480px; margin:0 auto; position:relative;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:30;}
  .overlay.center{align-items:center; padding:0 24px;}
  .modal{width:100%; max-width:480px; background:var(--bg); border-radius:24px 24px 0 0; padding:20px; padding-bottom:32px; max-height:90vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-head h2{font-size:16px; margin:0;}
  .icon-x{width:32px; height:32px; border-radius:10px; background:var(--dark-5); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .icon-x svg{width:16px; height:16px; color:var(--dark-60);}
  .field{margin-bottom:12px;}
  .field label{font-size:12px; color:var(--dark-50); display:block; margin-bottom:4px;}
  .field input, .field select{width:100%; background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:10px 12px; font-size:14px; outline:none; font-family:inherit;}
  .field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,163,61,.25);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .img-picker{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .img-box{width:80px; height:80px; border-radius:14px; background:#fff; border:2px dashed var(--dark-15); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; flex-shrink:0; padding:0;}
  .img-box img{width:100%; height:100%; object-fit:cover;}
  .img-box svg{width:22px; height:22px; color:var(--dark-15);}
  .img-btn{font-size:12px; font-weight:600; color:var(--dark); background:var(--dark-5); border:none; padding:8px 12px; border-radius:10px; cursor:pointer; font-family:inherit;}
  .img-remove{display:block; margin-top:6px; font-size:11px; color:var(--danger); background:none; border:none; cursor:pointer; padding:0; font-family:inherit;}
  .cover-box{width:100%; aspect-ratio:16/6; border-radius:14px; background:var(--dark); border:2px dashed var(--dark-15); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; padding:0; margin-bottom:8px;}
  .cover-box img{width:100%; height:100%; object-fit:cover;}
  .cover-box svg{width:22px; height:22px; color:rgba(255,255,255,.3);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .chip{font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; background:var(--dark-5); color:var(--dark-60); border:none; cursor:pointer; font-family:inherit;}
  .vrow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .vrow input[type=text]{width:88px; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:13px; outline:none; font-family:inherit;}
  .vrow input[type=number]{flex:1; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:13px; outline:none; font-family:inherit;}
  .vrow button{width:32px; height:32px; border-radius:10px; background:var(--danger-10); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .vrow button svg{width:13px; height:13px; color:var(--danger);}
  .vrow button:disabled{opacity:.3; cursor:default;}
  .add-size-link{font-size:12px; font-weight:600; color:var(--dark-60); background:none; border:none; margin-top:10px; display:flex; align-items:center; gap:4px; cursor:pointer; padding:0; font-family:inherit;}
  .add-size-link svg{width:13px; height:13px;}
  .submit-btn{width:100%; background:var(--dark); color:#fff; border:none; border-radius:12px; padding:13px; font-size:14px; font-weight:600; margin-top:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit;}
  .submit-btn svg{width:16px; height:16px;}
  .confirm-box{background:#fff; border-radius:16px; padding:20px; width:100%; max-width:320px;}
  .confirm-box p{margin:0;}
  .confirm-box .title{font-weight:600; margin-bottom:4px;}
  .confirm-box .desc{font-size:12px; color:var(--dark-50); margin-bottom:16px;}
  .confirm-actions{display:flex; gap:8px;}
  .confirm-actions button{flex:1; padding:10px; border-radius:12px; font-size:13px; font-weight:600; border:none; cursor:pointer; font-family:inherit;}
  .btn-cancel{background:var(--dark-5); color:var(--dark);}
  .btn-confirm{background:var(--danger); color:#fff;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; font-size:12px; font-weight:500; padding:10px 16px; border-radius:999px; box-shadow:0 6px 16px rgba(0,0,0,.25); z-index:50;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--dark-15); border-radius:3px;}

  /* ---------- DESKTOP / WIDE SCREEN LAYOUT ---------- */
  @media (min-width: 860px){
    body{ background:#E2DED2; }
    #app{ max-width:1240px; padding-bottom:60px; box-shadow:none; }
    .header{ border-radius:20px; max-width:1240px; margin:20px auto 0; padding:26px 32px 22px; }
    .header-top{ max-width:1000px; }
    .stats{ max-width:640px; }
    .tabs{ max-width:1240px; margin:16px auto 0; padding:0 32px; }
    .content{ max-width:1240px; margin:0 auto; padding:0 32px; }
    .search-row{ max-width:520px; }

    #list-items{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px; align-items:start; }
    #list-items .card{ margin-bottom:0; }
    .grid-container{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)) !important; }

    .report-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
    .report-grid > .report-card{ margin-bottom:0; }
    .report-grid > .report-card:last-child{ grid-column:1 / -1; }

    .fab-anchor{ max-width:1240px; margin:0 auto; position:relative; height:0; }
    .fab{ position:absolute; left:auto; right:32px; bottom:24px; transform:none; }
    .fab-label{ display:none !important; }
    .fab-manage{ position:absolute; left:auto; right:96px; bottom:24px; }
    .fab-manage-label{ display:none !important; }

    .overlay{ align-items:center; padding:24px; }
    .modal{ border-radius:20px; max-height:85vh; }
    #scanner-overlay{ padding:24px; }
    #scanner-overlay > div{ border-radius:20px; overflow:hidden; max-height:88vh; }

    .install-banner-wide{ text-align:center; }
  }
  @media (min-width: 860px) and (max-width: 1279px){
    .fab{ right:24px; }
  }

  /* ---------- PDF EXPORT (print) ---------- */
  .pdf-btn{ display:flex; align-items:center; gap:5px; background:var(--dark-5); color:var(--dark); border:none; padding:7px 12px; border-radius:10px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; white-space:nowrap; }
  .pdf-btn svg{ width:13px; height:13px; }
  .print-only{ display:none; }
  .print-header{ display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-bottom:12px; border-bottom:2px solid #1C2B33; }
  .print-logo{ width:56px; height:56px; border-radius:10px; object-fit:cover; }
  .print-header h1{ margin:0; font-size:18px; }
  .print-header p{ margin:2px 0 0; font-size:12px; color:#555; }
  .print-date{ color:#999 !important; }
  .print-summary{ display:flex; gap:24px; margin-bottom:14px; }
  .print-summary span{ display:block; color:#777; font-size:11px; }
  .print-summary b{ font-size:16px; }
  .print-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .print-table th, .print-table td{ border:1px solid #ccc; padding:6px 8px; text-align:left; }
  .print-table th{ background:#f0eee7; }
  .print-table td.num, .print-table th.num{ text-align:right; font-family:monospace; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ position:absolute; left:0; top:0; width:100%; display:block !important; }
  }
</style>
</head>
<body>
<div id="install-banner-root"></div>
<div id="print-area" class="print-only"></div>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="logo"></div>

    </text>
  </svg>
  <svg id="fab-manage-label" class="fab-manage-label" viewBox="0 0 200 190" width="200" height="190" aria-hidden="true">

    <text font-size="12" font-weight="700" style="fill:var(--danger); font-family:'Noto Sans Lao','Noto Sans',system-ui,sans-serif;">
      <textPath href="#fabManageLabelPath" startOffset="2%">ແກ້ໄຂໝວດໝູ່</textPath>
    </text>
  </svg>
  <button class="fab-manage" id="fab-manage-categories"></button>

</div>

<div id="modal-root"></div>
<div id="detail-root"></div>
<div id="brand-root"></div>
<div id="backup-root"></div>
<div id="scanner-root"></div>
<div id="category-modal-root"></div>
<div id="manage-categories-root"></div>
<div id="sell-root"></div>
<div id="buy-root"></div>
<div id="confirm-root"></div>

<script>
const STORAGE_KEY = 'khang-sinkha-products-v1';
const QUICK_SIZES = ['S','M','L','XL','XXL','Free'];
const CATEGORIES_KEY = 'khang-sinkha-categories-v1';
let CATEGORIES = [];
try{ CATEGORIES = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || 'null') || ['ໝວດຊຸດໂຮງງານ', 'ໝວດຊຸດເຊບຕີ້']; }
catch(e){ CATEGORIES = ['ໝວດຊຸດໂຮງງານ', 'ໝວດຊຸດເຊບຕີ້']; }
function saveCategories(){ try{ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }catch(e){} }

const ICONS = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',

  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  package: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
  chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.26a8 8 0 1 0-14.24 5.24"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>',
  barcode: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14"/><path d="M7 5v14"/><path d="M11 5v14"/><path d="M13.5 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>',
  sell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  buy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>'
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let products = [];
try{ products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ products = []; }

// One-time migration: old default unit "ໂຕ" renamed to "ລາຍການ"
(function migrateUnitLabel(){
  let changed = false;
  products = products.map(p => {
    if(p.unit === 'ໂຕ'){ changed = true; return { ...p, unit:'ລາຍການ' }; }
    return p;
  });
  if(changed){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }catch(e){}
  }
})();

let tab = 'list';
let search = '';
let expanded = {};
let viewMode = localStorage.getItem('khang-sinkha-view-mode') || 'list';
let detailId = null;
let formState = null;
let confirmDeleteId = null;
let toastTimer = null;
let barcodeSearch = '';
let reportCategoryFilter = '';

const SCANLOG_KEY = 'khang-sinkha-scanlog-v1';
let scanLog = [];
try{ scanLog = JSON.parse(localStorage.getItem(SCANLOG_KEY) || '[]'); }catch(e){ scanLog = []; }
function saveScanLog(){ try{ localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }catch(e){} }

let knownBarcodeSet = new Set();
scanLog.forEach(r => { if(r.code && !r.isDuplicate) knownBarcodeSet.add(String(r.code).trim().toLowerCase()); });
let barcodeSyncTimer = null;

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }
  catch(e){ showToast('ບັນທຶກບໍ່ສຳເລັດ, ອາດເປັນຍ້ອນຮູບໃຫຍ່ເກີນໄປ'); }
  scheduleAutoSync();
}

function withTotals(p){
  const totalQty = p.variants.reduce((s,v)=>s+v.qty,0);
  const lowVariants = p.variants.filter(v => v.qty <= p.minQty);
  return {...p, totalQty, lowVariants};
}

function showToast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 1800);
}

/* ---------- HEADER / STATS ---------- */
function renderStats(){
  const list = products.map(withTotals);
  const totalSKU = products.length;
  const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
  const lowCount = list.reduce((s,p)=>s+p.lowVariants.length,0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">ລາຍການ</div><div class="stat-value">${totalSKU}</div></div>
    <div class="stat"><div class="stat-label">ຈຳນວນລວມ</div><div class="stat-value">${totalQty}</div></div>
    <div class="stat ${lowCount>0?'warn':''}"><div class="stat-label">ໃກ້ໝົດ</div><div class="stat-value">${lowCount}<span style="display:block; font-size:10px; font-weight:600; margin-top:1px;">ລາຍການ</span></div></div>
  `;
}

/* ---------- TABS ---------- */
function renderTabButtons(){
  document.getElementById('tab-list-btn').innerHTML = ICONS.list + ' ລາຍການ';
  document.getElementById('tab-report-btn').innerHTML = ICONS.chart + ' ລາຍງານ';
  document.getElementById('tab-barcode-btn').innerHTML = ICONS.barcode + ' Barcode';
  document.getElementById('tab-list-btn').classList.toggle('active', tab==='list');
  document.getElementById('tab-report-btn').classList.toggle('active', tab==='report');
  document.getElementById('tab-barcode-btn').classList.toggle('active', tab==='barcode');
}

/* ---------- LIST TAB ---------- */
function renderContent(){
  const content = document.getElementById('content');
  if(tab === 'list'){
    content.innerHTML = `
      <div class="search-row">
        <div class="search-wrap">${ICONS.search}<input id="search-input" placeholder="ຄົ້ນຫາຊື່ ຫຼື ລະຫັດສິນຄ້າ..." value="${esc(search)}"><button type="button" class="search-scan-btn" id="search-scan-btn" title="ສະແກນ Barcode ເພື່ອຄົ້ນຫາ">${ICONS.barcode}</button></div>
        <div class="view-toggle">
          <button class="view-btn ${viewMode==='list'?'active':''}" id="view-list-btn">${ICONS.list}</button>
          <button class="view-btn ${viewMode==='grid'?'active':''}" id="view-grid-btn">${ICONS.grid}</button>
        </div>
      </div>
      <div id="list-items"></div>
    `;
    document.getElementById('search-input').addEventListener('input', e=>{
      search = e.target.value;
      renderListItems();
    });
    document.getElementById('search-scan-btn').addEventListener('click', ()=>openScanner('search'));
    document.getElementById('view-list-btn').addEventListener('click', ()=>setViewMode('list'));
    document.getElementById('view-grid-btn').addEventListener('click', ()=>setViewMode('grid'));
    renderListItems();
  } else if(tab === 'report'){
    renderReport();
  } else if(tab === 'barcode'){
    renderBarcodeTab();
  }
}

function setViewMode(m){
  viewMode = m;
  localStorage.setItem('khang-sinkha-view-mode', m);
  renderContent();
}

function renderListItems(){
  const container = document.getElementById('list-items');
  const filtered = products.map(withTotals).filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) || (p.code||'').toLowerCase().includes(search.toLowerCase())
  );
  if(filtered.length === 0){
    container.className = '';
    container.innerHTML = `<div class="empty">${ICONS.package}<p>${products.length===0 ? 'ຍັງບໍ່ມີສິນຄ້າ, ກົດ + ເພື່ອເພີ່ມລາຍການທຳອິດ' : 'ບໍ່ພົບສິນຄ້າທີ່ຄົ້ນຫາ'}</p></div>`;
    return;
  }
  if(viewMode === 'grid'){
    container.className = 'grid-container';
    container.innerHTML = filtered.map(p => gridCardHtml(p)).join('');
  } else {
    container.className = '';
    container.innerHTML = filtered.map(p => cardHtml(p)).join('');
  }
}

function gridCardHtml(p){
  const low = p.lowVariants.length > 0;
  const imgHtml = p.image ? `<img src="${p.image}" alt="">` : ICONS.image;
  const tagsHtml = p.variants.slice(0,4).map(v => `<span class="tag ${v.qty<=p.minQty?'low':''}">${esc(v.size)}:${v.qty}</span>`).join('');
  return `
    <div class="grid-card">
      <div class="grid-img" data-action="open-detail" data-id="${p.id}">
        ${imgHtml}
        ${low ? `<span class="grid-low-badge">${ICONS.alert}</span>` : ''}
      </div>
      <div class="grid-body" data-action="open-detail" data-id="${p.id}">
        <div class="grid-title">${esc(p.name)}</div>
        <div class="grid-sub">${p.code?('#'+esc(p.code)+' &middot; '):''}${p.price>0?(Number(p.price).toLocaleString()+' ກີບ'):''}</div>
        <div class="grid-tags">${tagsHtml}</div>
      </div>
      <span class="grid-qty-badge">${p.totalQty} <small>${esc(p.unit)}</small></span>
    </div>
  `;
}

function cardHtml(p){
  const low = p.lowVariants.length > 0;
  const isOpen = !!expanded[p.id];
  const tagsHtml = p.variants.map(v => `<span class="tag ${v.qty<=p.minQty?'low':''}">${esc(v.size)}:${v.qty}</span>`).join('');
  const imgHtml = p.image ? `<img src="${p.image}" alt="">` : ICONS.image;
  return `
    <div class="card">
      <div class="card-strip" style="background:${low?'#B94A3D':'#4C7A5E'}"></div>
      <div class="card-row">
        <button class="thumb" data-action="toggle-expand" data-id="${p.id}">${imgHtml}</button>
        <button class="card-main" data-action="toggle-expand" data-id="${p.id}">
          <div class="card-title"><span>${esc(p.name)}</span>${low?ICONS.alert:''}</div>
          <div class="card-sub">${p.code?('#'+esc(p.code)+' &middot; '):''}${p.price>0?(Number(p.price).toLocaleString()+' ກີບ'):''}</div>
          <div class="tags">${tagsHtml}</div>
        </button>
        <div class="card-right">
          <span class="card-total">${p.totalQty}</span>
          <button class="chevron-btn ${isOpen?'open':''}" data-action="toggle-expand" data-id="${p.id}">${ICONS.chevron}</button>
        </div>
      </div>
      ${isOpen ? expandHtml(p) : ''}
    </div>
  `;
}

function variantRowsHtml(p){
  return p.variants.map(v => `
    <div class="variant-row">
      <span class="variant-size">${esc(v.size)}</span>
      <div class="stepper">
        <button class="step-btn" data-action="adjust-variant" data-id="${p.id}" data-vid="${v.id}" data-delta="-1">${ICONS.minus}</button>
        <span class="step-val">${v.qty}</span>
        <button class="step-btn" data-action="adjust-variant" data-id="${p.id}" data-vid="${v.id}" data-delta="1">${ICONS.plus}</button>
      </div>
    </div>
  `).join('');
}

function expandHtml(p){
  return `
    <div class="expand-panel">
      ${variantRowsHtml(p)}
      <div class="row-actions">
        <button class="btn-edit" data-action="open-edit" data-id="${p.id}">${ICONS.pencil} ແກ້ໄຂ</button>
        <button class="btn-del" data-action="confirm-delete" data-id="${p.id}">${ICONS.trash} ລຶບ</button>
      </div>
    </div>
  `;
}

/* ---------- SELL OUT (deduct stock) ---------- */
let sellState = null;
let buyState = null;

function openSellModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  sellState = { productId:id, quantities:{} };
  p.variants.forEach(v => { sellState.quantities[v.id] = ''; });
  renderSellModal();
}
function closeSellModal(){ sellState = null; document.getElementById('sell-root').innerHTML=''; }

function renderSellModal(){
  const root = document.getElementById('sell-root');
  if(!sellState){ root.innerHTML=''; return; }
  const p = products.find(x=>x.id===sellState.productId);
  if(!p){ closeSellModal(); return; }
  const rows = p.variants.map(v => `

          <button class="btn-cancel" id="sell-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="sell-confirm-btn" style="background:var(--success);">ຢືນຢັນຂາຍອອກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('sell-overlay').addEventListener('click', e=>{ if(e.target.id==='sell-overlay') closeSellModal(); });
  document.getElementById('sell-cancel-btn').addEventListener('click', closeSellModal);
  document.querySelectorAll('.sell-qty-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      sellState.quantities[e.target.dataset.vid] = e.target.value;
    });

function confirmSell(){
  const p = products.find(x=>x.id===sellState.productId);
  if(!p) return;
  const errorEl = document.getElementById('sell-error');
  let totalSold = 0;
  const updates = {};
  for(const v of p.variants){
    const raw = sellState.quantities[v.id];
    const n = parseInt(raw, 10);
    const qty = isNaN(n) ? 0 : n;
    if(qty < 0){ errorEl.textContent = 'ຈຳນວນຕ້ອງບໍ່ຕິດລົບ'; errorEl.style.display = 'block'; return; }
    if(qty > v.qty){ errorEl.textContent = `ຂາຍອອກ "${v.size}" ເກີນຈຳນວນຄົງເຫຼືອ (ມີ ${v.qty})`; errorEl.style.display = 'block'; return; }
    updates[v.id] = qty;
    totalSold += qty;
  }
  if(totalSold <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນຢ່າງໜ້ອຍ 1 ຂະໜາດ'; errorEl.style.display = 'block'; return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => ({ ...v, qty: Math.max(0, v.qty - (updates[v.id] || 0)) })) }
    : pr
  );
  save();
  closeSellModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  showToast(`ຂາຍອອກສຳເລັດ: ${totalSold} ລາຍການ`);
}

/* ---------- BARCODE CAMERA SCANNER ---------- */
let scannerStream = null;
let scannerActive = false;
let scannerRAF = null;
let scannerCooldown = false;
let scannerMode = 'receive';
let scannerNewCount = 0;

function openScanner(mode){
  scannerMode = mode || 'receive';
  scannerNewCount = 0;

function closeScanner(){ stopScanner(); document.getElementById('scanner-root').innerHTML=''; }

    if(e.key === 'Enter') submitManualCode();
  });

async function startScanner(){
  if(!('BarcodeDetector' in window)) return;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
  }catch(e1){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:true });
    }catch(e2){
      handleCameraError(e2);
      return;
    }
  }
  scannerStream = stream;
  try{
    const video = document.getElementById('scanner-video');
    if(!video){ stopScanner(); return; }
    video.srcObject = scannerStream;
    await video.play();
    const detector = new BarcodeDetector();
    scannerActive = true;
    scannerCooldown = false;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const loop = async () => {
      if(!scannerActive) return;
      if(!scannerCooldown && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        try{
          const codes = await detector.detect(canvas);
          if(codes && codes.length){ handleScanResult(codes[0].rawValue); }
        }catch(e){}
      }
      scannerRAF = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    handleCameraError(e);
  }
}

function handleCameraError(e){
  const name = e && e.name;
  let msg = 'ເປີດກ້ອງບໍ່ສຳເລັດ, ກວດການອະນຸຍາດກ້ອງ';
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    msg = 'ບໍ່ໄດ້ຮັບອະນຸຍາດໃຊ້ກ້ອງ — ໄປອະນຸຍາດກ້ອງໃຫ້ browser ນີ້ໃນການຕັ້ງຄ່າ ແລ້ວກັບມາລອງໃໝ່';
  } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    msg = 'ບໍ່ພົບກ້ອງໃນອຸປະກອນນີ້';
  } else if(name === 'NotReadableError' || name === 'TrackStartError'){
    msg = 'ກ້ອງກຳລັງຖືກໃຊ້ໂດຍແອັບອື່ນຢູ່ — ປິດແອັບກ້ອງ/ວິດີໂອອື່ນແລ້ວລອງໃໝ່';
  } else if(name === 'SecurityError'){
    msg = 'ໜ້ານີ້ຕ້ອງເປີດຜ່ານ https ຈຶ່ງຈະໃຊ້ກ້ອງໄດ້';
  }
  showToast(msg);
  const hint = document.getElementById('scanner-hint');
  if(hint){
    hint.innerHTML = `${esc(msg)}<br><button type="button" id="camera-retry-btn" style="margin-top:8px; background:var(--accent); color:var(--dark); border:none; border-radius:999px; padding:6px 16px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ລອງໃໝ່</button>`;
    hint.style.color = '#E8926B';
    const retryBtn = document.getElementById('camera-retry-btn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{
      hint.textContent = scannerMode === 'search' ? 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ຈະສະແກນອັດຕະໂນມັດ' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ';
      hint.style.color = 'rgba(255,255,255,.7)';
      startScanner();
    });
  }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild) frame.firstElementChild.style.borderColor = '#B94A3D';
}

function stopScanner(){
  scannerActive = false;
  scannerCooldown = false;
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function isKnownBarcode(codeNorm){ return knownBarcodeSet.has(codeNorm); }

async function refreshKnownBarcodesFromSheet(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
    const ok = await ensureToken();
    if(!ok) return;
    const sheetId = await findOrCreateSheet();
    const res = await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A2:A100000`);
    const data = await res.json();
    (data.values || []).forEach(row => {
      if(row[0]) knownBarcodeSet.add(String(row[0]).trim().toLowerCase());
    });
  }catch(e){ /* best-effort, ignore */ }
}

function setScannerHint(text, colorHex){
  const hint = document.getElementById('scanner-hint');
  if(hint){ hint.textContent = text; hint.style.color = colorHex || 'rgba(255,255,255,.7)'; }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild){ frame.firstElementChild.style.borderColor = colorHex || 'var(--accent)'; }
}

function scheduleBarcodeSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(barcodeSyncTimer);
  barcodeSyncTimer = setTimeout(()=>{ syncScanLogToSheet(true); }, 1200);
}

function handleScanResult(rawCode){
  const code = (rawCode || '').trim();
  if(!code) return;

  if(scannerMode === 'search'){
    stopScanner();
    if(navigator.vibrate) navigator.vibrate(120);
    closeScanner();
    search = code;
    const si = document.getElementById('search-input');
    if(si) si.value = code;
    renderListItems();
    showToast('ຄົ້ນຫາ: ' + code);
    return;
  }

  // receive mode: duplicate check + log-to-sheet only — camera stays open for continuous scanning
  const norm = code.toLowerCase();
  const isDup = isKnownBarcode(norm);

  if(navigator.vibrate) navigator.vibrate(isDup ? [80,60,80] : 120);

  if(isDup){
    showToast('ພັດສະດຸໄດ້ຮັບແລ້ວ');
    setScannerHint('⚠ ພັດສະດຸໄດ້ຮັບແລ້ວ: ' + code, '#E8A33D');
  } else {
    knownBarcodeSet.add(norm);
    const entry = { id:uid(), code, scannedAt:new Date().toISOString(), isDuplicate:false, syncedToSheet:false };
    scanLog = [entry, ...scanLog];
    saveScanLog();
    scannerNewCount++;
    showToast('ບັນທຶກແລ້ວ: ' + code);
    setScannerHint('✓ ບັນທຶກແລ້ວ: ' + code, '#4C7A5E');
    scheduleBarcodeSync();
  }

  if(tab === 'barcode') renderBarcodeList();

  scannerCooldown = true;
  setTimeout(()=>{
    scannerCooldown = false;
    setScannerHint(scannerNewCount>0 ? 'ສະແກນແລ້ວ ' + scannerNewCount + ' ພັດສະດຸໃໝ່' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ', 'var(--accent)');
  }, 1400);
}

}
function closeManageCategoriesModal(){ manageCategoriesState = null; document.getElementById('manage-categories-root').innerHTML=''; collapseFabs(); }

function renderManageCategoriesModal(){
  const root = document.getElementById('manage-categories-root');
  if(!manageCategoriesState){ root.innerHTML=''; return; }
  const visible = manageCategoriesState.filter(c => !c.deleted);
  const rows = visible.length ? visible.map(c => `
    <div class="sell-row" data-cid="${c.id}">
      ${c.editing
        ? `<input type="text" class="manage-cat-input" data-cid="${c.id}" value="${esc(c.current)}" style="flex:1; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:14px; outline:none; font-family:inherit;">`
        : `<span class="sell-size" style="flex:1;">${esc(c.current)}</span>`}
      <button type="button" class="icon-btn-sm" data-action-cat="edit" data-cid="${c.id}" style="background:var(--dark-5);">${ICONS.pencil}</button>

  `).join('') : '<p class="muted">ຍັງບໍ່ມີໝວດໝູ່</p>';

  root.innerHTML = `
    <div class="overlay center" id="manage-cat-overlay">
      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຈັດການໝວດໝູ່ສິນຄ້າ</p>
        <p class="desc" style="margin-bottom:12px;">ແກ້ໄຂຊື່ ຫຼື ລຶບໝວດໝູ່, ແລ້ວກົດບັນທຶກເພື່ອຢືນຢັນ</p>
        <div id="manage-cat-rows">${rows}</div>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="manage-cat-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="manage-cat-save-btn" style="background:var(--dark); color:#fff;">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('manage-cat-overlay').addEventListener('click', e=>{ if(e.target.id==='manage-cat-overlay') closeManageCategoriesModal(); });
  document.getElementById('manage-cat-cancel-btn').addEventListener('click', closeManageCategoriesModal);
  document.getElementById('manage-cat-save-btn').addEventListener('click', saveManagedCategories);

  document.querySelectorAll('[data-action-cat="edit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = manageCategoriesState.find(c => c.id === btn.dataset.cid);
      if(item){ item.editing = !item.editing; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('[data-action-cat="delete"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = manageCategoriesState.find(c => c.id === btn.dataset.cid);
      if(item){ item.deleted = true; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('.manage-cat-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const item = manageCategoriesState.find(c => c.id === e.target.dataset.cid);
      if(item) item.current = e.target.value;
    });
  });
}

function saveManagedCategories(){
  const kept = manageCategoriesState.filter(c => !c.deleted);
  const names = kept.map(c => c.current.trim()).filter(n => n);
  const dedupCheck = new Set(names.map(n=>n.toLowerCase()));
  if(dedupCheck.size !== names.length){
    showToast('ມີຊື່ໝວດໝູ່ຊ້ຳກັນ, ກະລຸນາແກ້ໄຂ');
    return;
  }
  const removedNames = manageCategoriesState.filter(c => c.deleted).map(c => c.original);
  const renameMap = {};
  kept.forEach(c => { if(c.current.trim() !== c.original) renameMap[c.original] = c.current.trim(); });

  CATEGORIES = names;
  saveCategories();

  if(Object.keys(renameMap).length || removedNames.length){
    products = products.map(p => {
      if(p.category && renameMap[p.category]) return { ...p, category: renameMap[p.category] };
      if(p.category && removedNames.includes(p.category)) return { ...p, category: '' };
      return p;
    });
    save();
  }
  if(removedNames.includes(reportCategoryFilter) || (renameMap[reportCategoryFilter])){
    reportCategoryFilter = renameMap[reportCategoryFilter] || '';
  }

  closeManageCategoriesModal();
  showToast('ບັນທຶກການປ່ຽນແປງໝວດໝູ່ແລ້ວ');
  renderReport();
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

}

/* ---------- GOOGLE DRIVE SYNC ---------- */
const GDRIVE_CLIENT_ID_KEY = 'khang-sinkha-gdrive-client-id';
const GDRIVE_FILE_ID_KEY = 'khang-sinkha-gdrive-file-id';
const GDRIVE_CONNECTED_KEY = 'khang-sinkha-gdrive-connected';
const GDRIVE_LAST_SYNC_KEY = 'khang-sinkha-gdrive-last-sync';
const DRIVE_FILE_NAME = 'khang-sinkha-backup.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const SHEET_ID_KEY = 'khang-sinkha-sheet-id';
const SHEET_LAST_SYNC_KEY = 'khang-sinkha-sheet-last-sync';
const SHEET_TITLE = 'khang-sinkha-barcode-log';

let tokenClient = null;
let gdriveToken = null;
let syncDebounceTimer = null;

function getClientId(){ return localStorage.getItem(GDRIVE_CLIENT_ID_KEY) || ''; }

function loadGsiScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('gsi load failed'));
    document.head.appendChild(s);
  });
}

function connectDrive(promptMode){
  const clientId = getClientId();
  if(!clientId){ showToast('ກະລຸນາໃສ່ Google Client ID ກ່ອນ'); return Promise.resolve(false); }
  return loadGsiScript().then(()=> new Promise((resolve)=>{
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if(resp && resp.access_token){
            gdriveToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in*1000 - 60000) };
            localStorage.setItem(GDRIVE_CONNECTED_KEY, '1');
            resolve(true);
          } else resolve(false);
        },
        error_callback: () => resolve(false)
      });
      tokenClient.requestAccessToken({ prompt: promptMode === undefined ? '' : promptMode });
    }catch(e){ resolve(false); }
  })).catch(()=>{ showToast('ໂຫຼດ Google SDK ບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດ'); return false; });
}

function isDriveConnected(){ return !!(gdriveToken && gdriveToken.expires_at > Date.now()); }

async function ensureToken(){
  if(isDriveConnected()) return true;
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return false;
  return await connectDrive('none');
}

async function driveRequest(url, options){
  const ok = await ensureToken();
  if(!ok) throw new Error('no-auth');
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + gdriveToken.access_token });
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text(); throw new Error('drive-error: '+res.status+' '+t); }
  return res;
}

async function findDriveFileId(){
  let fileId = localStorage.getItem(GDRIVE_FILE_ID_KEY);
  if(fileId) return fileId;
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const data = await res.json();
  if(data.files && data.files.length){
    fileId = data.files[0].id;
    localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    return fileId;
  }
  return null;
}

async function findOrCreateSheet(){
  let sheetId = localStorage.getItem(SHEET_ID_KEY);
  if(sheetId) return sheetId;
  const q = encodeURIComponent(`name='${SHEET_TITLE}' and trashed=false and mimeType='application/vnd.google-apps.spreadsheet'`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length){
    sheetId = data.files[0].id;
    localStorage.setItem(SHEET_ID_KEY, sheetId);
    return sheetId;
  }
  const createRes = await driveRequest('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ properties:{ title: SHEET_TITLE }, sheets:[{ properties:{ title:'Log' } }] })
  });
  const createData = await createRes.json();
  sheetId = createData.spreadsheetId;
  localStorage.setItem(SHEET_ID_KEY, sheetId);
  await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A1:B1?valueInputOption=RAW`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ values:[['ລະຫັດ Barcode','ວັນທີ-ເວລາ ຮັບເຂົ້າ']] })
  });
  return sheetId;
}

async function syncScanLogToSheet(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){
      ok = await connectDrive('');
    }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google'); return; }
    const sheetId = await findOrCreateSheet();
    const unsynced = scanLog.filter(r=>!r.syncedToSheet);
    if(unsynced.length === 0){ if(!silent) showToast('ບໍ່ມີລາຍການໃໝ່ໃຫ້ sync'); return; }
    const rows = unsynced.map(r => [r.code, new Date(r.scannedAt).toLocaleString('lo-LA')]);
    await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A:B:append?valueInputOption=RAW`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ values: rows })
    });
    const unsyncedIds = new Set(unsynced.map(r=>r.id));
    scanLog = scanLog.map(r => unsyncedIds.has(r.id) ? { ...r, syncedToSheet:true } : r);
    saveScanLog();
    localStorage.setItem(SHEET_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('ສົ່ງອອກ Log ໄປ Google Sheet ສຳເລັດ (' + unsynced.length + ' ລາຍການ)');
    if(tab === 'barcode') renderBarcodeTab();
  }catch(e){
    if(!silent) showToast('ສົ່ງອອກບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncToDrive(silent){
  try{
    const ok = await ensureToken();
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive'); return; }
    let fileId = await findDriveFileId();
    const payload = JSON.stringify({ app:'khang-sinkha', version:1, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg });
    if(!fileId){
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = '-------khangsinkha' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      const data = await res.json();
      fileId = data.id;
      localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    } else {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method:'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
    }
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('Sync ຂຶ້ນ Google Drive ສຳເລັດ');
    if(document.getElementById('backup-overlay')) renderBackupModal();
  } catch(e){
    if(!silent) showToast('Sync ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncFromDrive(){
  try{
    const ok = await ensureToken();
    if(!ok){ showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive'); return; }
    const fileId = await findDriveFileId();
    if(!fileId){ showToast('ຍັງບໍ່ມີໄຟລ໌ສຳຮອງໃນ Drive'); return; }
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) throw new Error('bad format');
    pendingImportData = { products:list, logo: Array.isArray(parsed) ? null : (parsed.logo || null), cover: Array.isArray(parsed) ? null : (parsed.cover || null) };
    renderImportConfirm();
  } catch(e){
    showToast('ດຶງຂໍ້ມູນຈາກ Drive ບໍ່ສຳເລັດ');
  }
}

function disconnectDrive(){
  gdriveToken = null;
  localStorage.removeItem(GDRIVE_CONNECTED_KEY);
  localStorage.removeItem(GDRIVE_FILE_ID_KEY);
  showToast('ຍົກເລີກການເຊື່ອມຕໍ່ Google Drive ແລ້ວ');
  renderBackupModal();
}

function scheduleAutoSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(()=>{ syncToDrive(true); }, 2500);
}

function exportData(){
  const payload = { app:'khang-sinkha', version:1, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'khang-sinkha-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
  renderBackupModal();
  showToast('ດາວໂຫຼດໄຟລ໌ສຳຮອງແລ້ວ');
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : parsed.products;
      if(!Array.isArray(list)) throw new Error('bad format');
      const valid = list.every(p => p && typeof p.name === 'string');
      if(!valid) throw new Error('bad format');
      pendingImportData = { products:list, logo: Array.isArray(parsed) ? null : (parsed.logo || null), cover: Array.isArray(parsed) ? null : (parsed.cover || null) };
      renderImportConfirm();
    }catch(err){
      showToast('ໄຟລ໌ບໍ່ຖືກຕ້ອງ, ບໍ່ສາມາດນຳເຂົ້າໄດ້');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function renderImportConfirm(){
  const root = document.getElementById('confirm-root');
  const brandNote = (pendingImportData.logo || pendingImportData.cover) ? ' ພ້ອມທັງ Logo/Cover ທີ່ບັນທຶກໄວ້.' : '';
  root.innerHTML = `
    <div class="overlay center" id="import-overlay">
      <div class="confirm-box">
        <p class="title">ນຳເຂົ້າຂໍ້ມູນ?</p>
        <p class="desc">ພົບ ${pendingImportData.products.length} ລາຍການໃນໄຟລ໌ສຳຮອງ.${brandNote} ການນຳເຂົ້າຈະທັບຂໍ້ມູນປັດຈຸບັນທັງໝົດ ແລະ ບໍ່ສາມາດກູ້ຄືນໄດ້.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="import-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="import-ok-btn">ນຳເຂົ້າ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('import-overlay').addEventListener('click', e=>{ if(e.target.id==='import-overlay'){ pendingImportData=null; root.innerHTML=''; }});
  document.getElementById('import-cancel-btn').addEventListener('click', ()=>{ pendingImportData=null; root.innerHTML=''; });
  document.getElementById('import-ok-btn').addEventListener('click', ()=>{
    products = pendingImportData.products.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ທົ່ວໄປ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ທົ່ວໄປ', qty:0 }]
    }));
    if(pendingImportData.logo){ logoImg = pendingImportData.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(pendingImportData.cover){ coverImg = pendingImportData.cover; localStorage.setItem(COVER_KEY, coverImg); }
    save();
    pendingImportData = null;
    root.innerHTML = '';
    closeBackupModal();
    renderAll();
    showToast('ນຳເຂົ້າຂໍ້ມູນສຳເລັດ');
  });
}

/* ---------- ACTIONS (delegated) ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action === 'toggle-expand'){
    expanded[id] = !expanded[id];
    renderListItems();
  } else if(action === 'open-detail'){
    openDetail(id);
  } else if(action === 'open-sell'){
    openSellModal(id);
  } else if(action === 'open-buy'){
    openBuyModal(id);
  } else if(action === 'open-edit'){
    openEdit(id);
  } else if(action === 'confirm-delete'){
    confirmDelete(id);
  } else if(action === 'adjust-variant'){
    const vid = t.dataset.vid;
    const delta = parseInt(t.dataset.delta, 10);
    products = products.map(p => p.id===id ? { ...p, variants: p.variants.map(v => v.id===vid ? {...v, qty: Math.max(0, v.qty+delta)} : v) } : p);
    save();
    renderAll();
    if(detailId === id) renderDetailSheet();
  } else if(action === 'delete-scan'){
    const scanId = t.dataset.scanId;
    scanLog = scanLog.filter(r=>r.id!==scanId);
    saveScanLog();
    renderBarcodeList();
  }
});

document.getElementById('fab-manage-categories').addEventListener('click', ()=>{
  if(!fabExpanded){ expandFabs(); return; }
  openManageCategoriesModal();
});
document.getElementById('fab-manage-categories').innerHTML = ICONS.minus;
updateFabStyle();
document.getElementById('backup-open-btn').addEventListener('click', openBackupModal);
document.getElementById('backup-open-btn').innerHTML = ICONS.cloud;
document.getElementById('brand-open-btn').addEventListener('click', openBrandModal);
document.getElementById('brand-open-btn').innerHTML = ICONS.image;

/* ---------- MAIN RENDER ---------- */
function renderAll(){
  renderStats();
  renderTabButtons();
  renderContent();
  applyHeaderBrand();
}
renderAll();

/* ---------- PWA: service worker + install prompt ---------- */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const b = document.getElementById('install-banner-root');
  if(b) b.innerHTML = '';
});

function showInstallBanner(){
  if(document.getElementById('install-banner')) return;
  const root = document.getElementById('install-banner-root');
  root.innerHTML = `
    <div id="install-banner" style="position:sticky; top:0; z-index:5; background:var(--accent); color:var(--dark); display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:12px; font-weight:600;">
      <span style="flex:1;">ຕິດຕັ້ງແອັບນີ້ໃສ່ໜ້າຈໍຫຼັກໄດ້ເລີຍ</span>
      <button id="install-btn" style="background:var(--dark); color:#fff; border:none; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ຕິດຕັ້ງ</button>
      <button id="install-dismiss-btn" style="background:none; border:none; cursor:pointer; padding:4px; color:var(--dark);">${ICONS.x}</button>
    </div>
  `;
  document.getElementById('install-btn').addEventListener('click', async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    root.innerHTML = '';
  });
  document.getElementById('install-dismiss-btn').addEventListener('click', ()=>{ root.innerHTML=''; });
}

async function autoPullOnLoad(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY) || location.protocol === 'file:') return;
    const ok = await ensureToken();
    if(!ok) return;
    const fileId = await findDriveFileId();
    if(!fileId) return;
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const remoteTime = parsed.exportedAt ? new Date(parsed.exportedAt).getTime() : 0;
    const lastSyncStr = localStorage.getItem(GDRIVE_LAST_SYNC_KEY);
    const localSyncTime = lastSyncStr ? new Date(lastSyncStr).getTime() : 0;
    if(!remoteTime || remoteTime <= localSyncTime) return;

    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) return;

    products = list.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ທົ່ວໄປ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ທົ່ວໄປ', qty:0 }]
    }));
    if(parsed.logo){ logoImg = parsed.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(parsed.cover){ coverImg = parsed.cover; localStorage.setItem(COVER_KEY, coverImg); }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, parsed.exportedAt);
    renderAll();
    showToast('ດຶງຂໍ້ມູນລ່າສຸດຈາກ Drive ອັດຕະໂນມັດແລ້ວ');
  }catch(e){ /* best-effort background refresh, ignore failures */ }
}

if(localStorage.getItem(GDRIVE_CONNECTED_KEY) && location.protocol !== 'file:'){
  autoPullOnLoad();
}
</script>
