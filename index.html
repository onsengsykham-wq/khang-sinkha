    <option value="__none__" ${poListCategoryFilter==='__none__'?'selected':''}>ບໍ່ໄດ້ກຳນົດ</option>
  `;
  root.innerHTML = `
    <div class="overlay" id="po-list-overlay">
      <div class="modal" id="po-list-modal">
        <div class="modal-head">
          <h2>ລາຍການຈັດຊື້</h2>
          <button class="icon-x" id="po-list-close">${ICONS.x}</button>
        </div>
        <div class="search-row" style="margin-bottom:10px;">
          <div class="search-wrap" style="margin-bottom:0;">${ICONS.search}<input id="po-list-search" type="text" placeholder="ຄົ້ນຫາຊື່, ລະຫັດ, ຂະໜາດ..." value="${esc(poListSearch)}"></div>
          <select id="po-list-category-filter" style="flex-shrink:0; width:118px; height:40px; background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:0 6px; font-size:12px; font-family:inherit;">${categoryOptions}</select>
        </div>
        <div id="po-list-rows"></div>
      </div>
    </div>
  `;
  document.getElementById('po-list-overlay').addEventListener('click', e=>{ if(e.target.id==='po-list-overlay') closePurchaseOrderListModal(); });
  document.getElementById('po-list-close').addEventListener('click', closePurchaseOrderListModal);
  document.getElementById('po-list-search').addEventListener('input', e=>{ poListSearch = e.target.value; renderPurchaseOrderRows(); });
  document.getElementById('po-list-category-filter').addEventListener('change', e=>{ poListCategoryFilter = e.target.value; renderPurchaseOrderRows(); });
  renderPurchaseOrderRows();
}

function renderPurchaseOrderRows(){
  const rowsRoot = document.getElementById('po-list-rows');
  if(!rowsRoot) return;
  const q = poListSearch.trim().toLowerCase();

  let filtered = [...purchaseOrders];
  if(poListCategoryFilter){
    filtered = filtered.filter(o => {
      const cat = getPurchaseOrderCategory(o);
      return poListCategoryFilter === '__none__' ? !cat : cat === poListCategoryFilter;
    });
  }
  if(q){
    filtered = filtered.filter(o =>
      (o.productName||'').toLowerCase().includes(q) ||
      (o.color||'').toLowerCase().includes(q) ||
      (o.code||'').toLowerCase().includes(q) ||
      (o.size||'').toLowerCase().includes(q)
    );
  }
  const sorted = filtered.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const totalItems = sorted.reduce((s,o)=>s+o.qty,0);
  const isFiltering = !!(q || poListCategoryFilter);

  let rowsHtml;
  if(purchaseOrders.length === 0){
    rowsHtml = `<div class="empty">${ICONS.receiptCheck}<p>ຍັງບໍ່ມີລາຍການຈັດຊື້</p></div>`;
  } else if(sorted.length === 0){
    rowsHtml = `<div class="empty">${ICONS.search}<p>ບໍ່ພົບລາຍການທີ່ຄົ້ນຫາ</p></div>`;
  } else {
    rowsHtml = sorted.map(o => `
      <div class="report-card" style="margin-bottom:10px; background:rgba(154,201,59,.15);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div style="min-width:0;">
            <p style="margin:0;"><span style="display:inline-block; background:#2F6FED; color:#fff; font-weight:700; font-size:15px; padding:3px 9px; border-radius:8px;">${esc(o.productName)}${o.color && o.color !== '-' ? ' ('+esc(o.color)+')' : ''}</span></p>
            <p class="muted" style="margin:6px 0 0;">${o.code?('#'+esc(o.code)+' &middot; '):''}ຂະໜາດ ${esc(o.size)}</p>
            <p class="muted" style="margin:2px 0 0;">${esc(new Date(o.createdAt).toLocaleString('lo-LA'))}</p>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:10px;">
              <button type="button" class="order-icon-btn" style="color:var(--accent);" data-po-partial-id="${esc(o.id)}" title="ຮັບເຂົ້າບາງສ່ວນ">${ICONS.boxIn}</button>
              <button type="button" class="order-icon-btn" style="color:var(--success);" data-po-receive-id="${esc(o.id)}" title="ນຳເຂົ້າສາງ">${ICONS.check}</button>
              <button type="button" class="order-icon-btn" style="color:var(--danger);" data-po-cancel-id="${esc(o.id)}" title="ຍົກເລີກ">${ICONS.x}</button>
            </div>
            <span style="font-size:17px; font-weight:800; color:var(--dark); white-space:nowrap; font-family:monospace;">x${o.qty}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  rowsRoot.innerHTML = `
    <p class="muted" style="margin:-4px 0 12px; font-size:12px;">${isFiltering ? `ພົບ ${sorted.length} ລາຍການ, ລວມ ${totalItems} ໂຕ` : `ລາຍການທັງໝົດ ${sorted.length} ລາຍການ, ລວມ ${totalItems} ໂຕ`} — ສ້າງຈາກ "ສ້າງລາຍການຈັດຊື້"</p>
    ${rowsHtml}
  `;
  document.querySelectorAll('[data-po-receive-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ confirmReceiveIntoWarehouse(btn.dataset.poReceiveId); });
  });
  document.querySelectorAll('[data-po-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ confirmCancelOrder(btn.dataset.poCancelId); });
  });
  document.querySelectorAll('[data-po-partial-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ openPartialReceiveModal(btn.dataset.poPartialId); });
  });
}

/* ---------- ORDER ACTIONS (cancel / receive into warehouse) — act on ONE specific purchase-order entry by id,
   since duplicate code+size entries are now kept separate (never merged) and must not be confused with each other ---------- */
function closeOrderActionModal(){ const el = document.getElementById('order-action-root'); if(el) el.innerHTML = ''; }

function confirmCancelOrder(id){
  purchaseOrders = purchaseOrders.filter(o => o.id !== id);
  savePurchaseOrders();
  closeOrderActionModal();
  if(tab === 'report') renderReport();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast('ຍົກເລີກການຈັດຊື້ສຳເລັດ');
}

function confirmReceiveIntoWarehouse(id){
  const order = purchaseOrders.find(o => o.id === id);
  if(!order) { closeOrderActionModal(); return; }
  const p = products.find(pr => (pr.code||'').trim() === order.code);
  if(!p){ closeOrderActionModal(); showToast('ບໍ່ພົບສິນຄ້າຕາມລະຫັດນີ້'); return; }
  const variant = p.variants.find(v => v.size === order.size);
  if(!variant){ closeOrderActionModal(); showToast('ບໍ່ພົບຂະໜາດສິນຄ້ານີ້'); return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => v.id === variant.id ? { ...v, qty: v.qty + order.qty } : v) }
    : pr
  );
  save();

  purchaseOrders = purchaseOrders.filter(o => o.id !== id);
  savePurchaseOrders();

  closeOrderActionModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast('ເພີ່ມສິນຄ້າເຂົ້າສາງຮຽບຮ້ອຍແລ້ວ');
}

/* ---------- PARTIAL RECEIVE (receive only part of a purchase-order entry's quantity) ----------
   ໃຊ້ໃນກໍລະນີເຄື່ອງມາບໍ່ພ້ອມ/ບໍ່ຄົບຕາມທີ່ສັ່ງ: ຮັບເຂົ້າສາງເທົ່າທີ່ມາຈິງ, ຫຼຸດຍອດທີ່ຍັງເຫຼືອສັ່ງຊື້ລົງ,
   ແລະ ຖ້າຮັບຄົບໝົດແລ້ວ (ຍອດເຫຼືອ <= 0) ໃຫ້ລຶບລາຍການນັ້ນອອກຄືກັບການຮັບເຂົ້າແບບເຕັມ */
let partialReceiveId = null;

function openPartialReceiveModal(id){
  partialReceiveId = id;
  renderPartialReceiveModal();
}
function closePartialReceiveModal(){
  partialReceiveId = null;
  const el = document.getElementById('partial-receive-root');
  if(el) el.innerHTML = '';
}
function renderPartialReceiveModal(){
  const root = document.getElementById('partial-receive-root');
  if(!partialReceiveId){ root.innerHTML=''; return; }
  const order = purchaseOrders.find(o => o.id === partialReceiveId);
  if(!order){ closePartialReceiveModal(); return; }
  root.innerHTML = `
    <div class="overlay center" id="partial-receive-overlay">
      <div class="confirm-box" style="max-width:340px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຮັບເຂົ້າສາງບາງສ່ວນ</p>
        <p class="desc" style="margin-bottom:12px;">${esc(order.productName)}${order.color && order.color !== '-' ? ' ('+esc(order.color)+')' : ''} · ຂະໜາດ ${esc(order.size)}${order.code?(' · #'+esc(order.code)):''} — ຍັງເຫຼືອສັ່ງຊື້ <b>${order.qty}</b> ໂຕ</p>
        <div class="field" style="margin-bottom:0;">
          <label>ຈຳນວນທີ່ຮັບເຂົ້າຄັ້ງນີ້ *</label>
          <input id="partial-receive-qty" type="number" inputmode="numeric" min="1" max="${order.qty}" placeholder="ໃສ່ຈຳນວນທີ່ໄດ້ຮັບຈິງ">
        </div>
        <p id="partial-receive-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="partial-receive-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="partial-receive-confirm-btn" style="background:var(--accent); color:var(--dark);">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('partial-receive-overlay').addEventListener('click', e=>{ if(e.target.id==='partial-receive-overlay') closePartialReceiveModal(); });
  document.getElementById('partial-receive-cancel-btn').addEventListener('click', closePartialReceiveModal);
  document.getElementById('partial-receive-confirm-btn').addEventListener('click', confirmPartialReceive);
}

function confirmPartialReceive(){
  const order = purchaseOrders.find(o => o.id === partialReceiveId);
  const errorEl = document.getElementById('partial-receive-error');
  if(!order){ closePartialReceiveModal(); return; }

  const raw = document.getElementById('partial-receive-qty').value;
  const n = parseInt(raw, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນທີ່ຖືກຕ້ອງ (ຫຼາຍກວ່າ 0)'; errorEl.style.display = 'block'; return; }
  if(n > order.qty){ errorEl.textContent = `ຈຳນວນທີ່ຮັບເຂົ້າຕ້ອງບໍ່ເກີນຍອດທີ່ຍັງເຫຼືອສັ່ງຊື້ (${order.qty})`; errorEl.style.display = 'block'; return; }

  const p = products.find(pr => (pr.code||'').trim() === order.code);
  if(!p){ errorEl.textContent = 'ບໍ່ພົບສິນຄ້າຕາມລະຫັດນີ້'; errorEl.style.display = 'block'; return; }
  const variant = p.variants.find(v => v.size === order.size);
  if(!variant){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດສິນຄ້ານີ້'; errorEl.style.display = 'block'; return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => v.id === variant.id ? { ...v, qty: v.qty + n } : v) }
    : pr
  );
  save();

  const remaining = order.qty - n;
  if(remaining <= 0){
    purchaseOrders = purchaseOrders.filter(o => o.id !== order.id);
  } else {
    purchaseOrders = purchaseOrders.map(o => o.id === order.id ? { ...o, qty: remaining } : o);
  }
  savePurchaseOrders();

  closePartialReceiveModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast(remaining <= 0
    ? `ຮັບເຂົ້າສາງ x${n} ຄົບຖ້ວນຕາມທີ່ສັ່ງແລ້ວ`
    : `ຮັບເຂົ້າສາງ x${n} ແລ້ວ, ຍັງເຫຼືອສັ່ງຊື້ x${remaining}`);
}

/* ---------- BARCODE CAMERA SCANNER ---------- */
let scannerStream = null;
let scannerActive = false;
let scannerRAF = null;
let scannerCooldown = false;
let scannerMode = 'receive';
let scannerNewCount = 0;

function openScanner(mode){
  scannerMode = mode || 'receive';
  scannerNewCount = 0;
  renderScannerModal();
  startScanner();
  if(scannerMode === 'receive') refreshKnownBarcodesFromSheet();
}
function closeScanner(){ stopScanner(); document.getElementById('scanner-root').innerHTML=''; }

function renderScannerModal(){

async function startScanner(){
  if(!('BarcodeDetector' in window)) return;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
  }catch(e1){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:true });
    }catch(e2){
      handleCameraError(e2);
      return;
    }
  }
  scannerStream = stream;
  try{
    const video = document.getElementById('scanner-video');
    if(!video){ stopScanner(); return; }
    video.srcObject = scannerStream;
    await video.play();
    const detector = new BarcodeDetector();
    scannerActive = true;
    scannerCooldown = false;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const loop = async () => {
      if(!scannerActive) return;
      if(!scannerCooldown && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        try{
          const codes = await detector.detect(canvas);
          if(codes && codes.length){ handleScanResult(codes[0].rawValue); }
        }catch(e){}
      }
      scannerRAF = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    handleCameraError(e);
  }
}

function handleCameraError(e){
  const name = e && e.name;
  let msg = 'ເປີດກ້ອງບໍ່ສຳເລັດ, ກວດການອະນຸຍາດກ້ອງ';
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    msg = 'ບໍ່ໄດ້ຮັບອະນຸຍາດໃຊ້ກ້ອງ — ໄປອະນຸຍາດກ້ອງໃຫ້ browser ນີ້ໃນການຕັ້ງຄ່າ ແລ້ວກັບມາລອງໃໝ່';
  } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    msg = 'ບໍ່ພົບກ້ອງໃນອຸປະກອນນີ້';
  } else if(name === 'NotReadableError' || name === 'TrackStartError'){
    msg = 'ກ້ອງກຳລັງຖືກໃຊ້ໂດຍແອັບອື່ນຢູ່ — ປິດແອັບກ້ອງ/ວິດີໂອອື່ນແລ້ວລອງໃໝ່';
  } else if(name === 'SecurityError'){
    msg = 'ໜ້ານີ້ຕ້ອງເປີດຜ່ານ https ຈຶ່ງຈະໃຊ້ກ້ອງໄດ້';
  }
  showToast(msg);
  const hint = document.getElementById('scanner-hint');
  if(hint){
    hint.innerHTML = `${esc(msg)}<br><button type="button" id="camera-retry-btn" style="margin-top:8px; background:var(--accent); color:var(--dark); border:none; border-radius:999px; padding:6px 16px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ລອງໃໝ່</button>`;
    hint.style.color = '#E8926B';
    const retryBtn = document.getElementById('camera-retry-btn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{
      hint.textContent = scannerMode === 'search' ? 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ຈະສະແກນອັດຕະໂນມັດ' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ';
      hint.style.color = 'rgba(255,255,255,.7)';
      startScanner();
    });
  }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild) frame.firstElementChild.style.borderColor = '#B94A3D';
}

function stopScanner(){
  scannerActive = false;
  scannerCooldown = false;
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function isKnownBarcode(codeNorm){ return knownBarcodeSet.has(codeNorm); }

async function refreshKnownBarcodesFromSheet(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
    const ok = await ensureToken();
    if(!ok) return;
    const sheetId = await findOrCreateSheet();
    const res = await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A2:A100000`);
    const data = await res.json();
    (data.values || []).forEach(row => {
      if(row[0]) knownBarcodeSet.add(String(row[0]).trim().toLowerCase());
    });
  }catch(e){ /* best-effort, ignore */ }
}

function setScannerHint(text, colorHex){
  const hint = document.getElementById('scanner-hint');
  if(hint){ hint.textContent = text; hint.style.color = colorHex || 'rgba(255,255,255,.7)'; }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild){ frame.firstElementChild.style.borderColor = colorHex || 'var(--accent)'; }
}

function scheduleBarcodeSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(barcodeSyncTimer);
  barcodeSyncTimer = setTimeout(()=>{ syncScanLogToSheet(true); }, 1200);
}

function handleScanResult(rawCode){
  const code = (rawCode || '').trim();
  if(!code) return;

  if(scannerMode === 'search'){
    stopScanner();
    if(navigator.vibrate) navigator.vibrate(120);
    closeScanner();
    search = code;
    const si = document.getElementById('search-input');
    if(si) si.value = code;
    renderListItems();
    showToast('ຄົ້ນຫາ: ' + code);
    return;
  }

  if(scannerMode === 'quick'){
    stopScanner();
    closeScanner();
    const norm = code.toLowerCase();
    const product = products.find(p => (p.code||'').trim().toLowerCase() === norm && (p.code||'').trim() !== '');
    if(!product){
      if(navigator.vibrate) navigator.vibrate([80,60,80]);
      showToast('ບໍ່ມີສິນຄ້ານີ້ໃນລະບົບ');
      return;
    }
    if(navigator.vibrate) navigator.vibrate(120);
    openQuickScanActionModal(product);
    return;
  }

  // receive mode: duplicate check + log-to-sheet only — camera stays open for continuous scanning
  const norm = code.toLowerCase();
  const isDup = isKnownBarcode(norm);

  if(navigator.vibrate) navigator.vibrate(isDup ? [80,60,80] : 120);

  if(isDup){
    showToast('ພັດສະດຸໄດ້ຮັບແລ້ວ');
    setScannerHint('⚠ ພັດສະດຸໄດ້ຮັບແລ້ວ: ' + code, '#E8A33D');
  } else {
    knownBarcodeSet.add(norm);
    const entry = { id:uid(), code, scannedAt:new Date().toISOString(), isDuplicate:false, syncedToSheet:false };
    scanLog = [entry, ...scanLog];
    saveScanLog();
    scannerNewCount++;
    showToast('ບັນທຶກແລ້ວ: ' + code);
    setScannerHint('✓ ບັນທຶກແລ້ວ: ' + code, '#4C7A5E');
    scheduleBarcodeSync();
  }

  if(tab === 'barcode') renderBarcodeList();

  scannerCooldown = true;
  setTimeout(()=>{
    scannerCooldown = false;
    setScannerHint(scannerNewCount>0 ? 'ສະແກນແລ້ວ ' + scannerNewCount + ' ພັດສະດຸໃໝ່' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ', 'var(--accent)');
  }, 1400);
}

function openManageCategoriesModal(){

function closeManageCategoriesModal(){ manageCategoriesState = null; document.getElementById('manage-categories-root').innerHTML=''; collapseFabs(); setFabBusy(false); }

function renderManageCategoriesModal(){
  const root = document.getElementById('manage-categories-root');

  const visible = manageCategoriesState.filter(c => !c.deleted);
  const rows = visible.length ? visible.map(c => `
    <div class="sell-row" data-cid="${c.id}">

        ? `<input type="text" class="manage-cat-input" data-cid="${c.id}" value="${esc(c.current)}" style="flex:1; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:14px; outline:none; font-family:inherit;">`

    <div class="overlay center" id="manage-cat-overlay">
      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຈັດການໝວດໝູ່ສິນຄ້າ</p>
        <p class="desc" style="margin-bottom:12px;">ແກ້ໄຂຊື່ ຫຼື ລຶບໝວດໝູ່, ແລ້ວກົດບັນທຶກເພື່ອຢືນຢັນ</p>

        </div>
      </div>
    </div>

  document.getElementById('manage-cat-overlay').addEventListener('click', e=>{ if(e.target.id==='manage-cat-overlay') closeManageCategoriesModal(); });
  document.getElementById('manage-cat-cancel-btn').addEventListener('click', closeManageCategoriesModal);
  document.getElementById('manage-cat-save-btn').addEventListener('click', saveManagedCategories);

  document.querySelectorAll('[data-action-cat="edit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = manageCategoriesState.find(c => c.id === btn.dataset.cid);
      if(item){ item.editing = !item.editing; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('[data-action-cat="delete"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      if(item){ item.deleted = true; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('.manage-cat-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const item = manageCategoriesState.find(c => c.id === e.target.dataset.cid);
      if(item) item.current = e.target.value;
    });
  });
}

function saveManagedCategories(){
  const kept = manageCategoriesState.filter(c => !c.deleted);
  const names = kept.map(c => c.current.trim()).filter(n => n);
  const dedupCheck = new Set(names.map(n=>n.toLowerCase()));
  if(dedupCheck.size !== names.length){
    showToast('ມີຊື່ໝວດໝູ່ຊ້ຳກັນ, ກະລຸນາແກ້ໄຂ');
    return;
  }
  const removedNames = manageCategoriesState.filter(c => c.deleted).map(c => c.original);
  const renameMap = {};
  kept.forEach(c => { if(c.current.trim() !== c.original) renameMap[c.original] = c.current.trim(); });

  CATEGORIES = names;
  saveCategories();

  if(Object.keys(renameMap).length || removedNames.length){
    products = products.map(p => {
      if(p.category && renameMap[p.category]) return { ...p, category: renameMap[p.category] };
      if(p.category && removedNames.includes(p.category)) return { ...p, category: '' };
      return p;
    });
    save();
  }
  if(removedNames.includes(reportCategoryFilter) || (renameMap[reportCategoryFilter])){
    reportCategoryFilter = renameMap[reportCategoryFilter] || '';
  }

  closeManageCategoriesModal();
  showToast('ບັນທຶກການປ່ຽນແປງໝວດໝູ່ແລ້ວ');
  renderReport();
}

function renderReport(){
  const content = document.getElementById('content');
  const list = products.map(withTotals);
  const totalSKU = products.length;
  const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
  const totalValue = list.reduce((s,p)=>s+p.totalQty*p.price,0);
  const lowProducts = list.filter(p=>p.lowVariants.length>0);
  const lowCount = list.reduce((s,p)=>s+p.lowVariants.length,0);

  let lowHtml = '<p class="muted">ບໍ່ມີສິນຄ້າໃກ້ໝົດ, ສະຕັອກປົກກະຕິ</p>';
  if(lowProducts.length>0){
    lowHtml = lowProducts.map(p => p.lowVariants.map(v => {
      const order = findPendingOrder((p.code||'').trim(), v.size);
      const badge = order
        ? `<span class="low-cart-badge" title="ສັ່ງຊື້ແລ້ວ ${sumPendingOrderQty((p.code||'').trim(), v.size)} ລາຍການ">${ICONS.cart}</span>`
        : '';
      return `
      <div class="low-item">
        <span>${esc(p.name)} <span class="muted" style="font-weight:700; color:var(--dark);">(${esc(v.size)})</span>${badge}</span>
        <span style="color:var(--danger); font-family:monospace; font-weight:600;">${v.qty} / ${p.minQty}</span>
      </div>
    `;
    }).join('')).join('');
  }

  let stockHtml = '<p class="muted">ຍັງບໍ່ມີຂໍ້ມູນສິນຄ້າ</p>';
  let stockRowCount = 0;
  if(list.length>0){
    const rows = [];
    [...list].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      p.variants.forEach(v => {
        if(v.qty === 0) return;
        rows.push(`
          <div class="stock-item">
            <span>${esc(p.name)} <span class="muted" style="font-weight:700; color:var(--dark);">(${esc(v.size)})</span></span>
            <span style="font-family:monospace;">${v.qty} ລາຍການ</span>
          </div>
        `);
      });
    });
    stockRowCount = rows.length;
    stockHtml = rows.join('') || '<p class="muted">ທຸກຂະໜາດໝົດສະຕັອກ (0)</p>';
  }

  function matchesCategory(p){
    if(reportCategoryFilter === '') return true;
    if(reportCategoryFilter === '__none__') return !p.category;
    return p.category === reportCategoryFilter;
  }
  const categoryList = list.filter(matchesCategory);

/* ---------- PDF EXPORT (print) ---------- */
function printReport(kind){
  const list = products.map(withTotals);
  const now = new Date().toLocaleString('lo-LA');
  let title = '';
  let bodyHtml = '';

  if(kind === 'value'){
    title = 'ລາຍງານມູນຄ່າສະຕັອກລວມ';
    const totalSKU = products.length;
    const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
    const totalValue = list.reduce((s,p)=>s+p.totalQty*p.price,0);
    const rows = [...list].sort((a,b)=>a.name.localeCompare(b.name)).map((p,i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td class="num">${p.totalQty}</td>
        <td class="num">${p.price.toLocaleString()}</td>
        <td class="num">${(p.totalQty*p.price).toLocaleString()}</td>
      </tr>
    `).join('') || `<tr><td colspan="6" style="text-align:center; color:#888;">ຍັງບໍ່ມີຂໍ້ມູນສິນຄ້າ</td></tr>`;
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການ</span><b>${totalSKU}</b></div>
        <div><span>ຈຳນວນລວມ</span><b>${totalQty} ລາຍການ</b></div>
        <div><span>ມູນຄ່າລວມ</span><b>${totalValue.toLocaleString()} ກີບ</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th class="num">ຈຳນວນ</th><th class="num">ລາຄາ/ໜ່ວຍ</th><th class="num">ມູນຄ່າລວມ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } else if(kind === 'lowstock'){
    title = 'ລາຍງານສິນຄ້າໃກ້ໝົດ';
    const lowRows = [];
    list.forEach(p => { p.lowVariants.forEach(v => { lowRows.push({p,v}); }); });
    const rows = lowRows.map(({p,v}, i) => {
      const order = findPendingOrder((p.code||'').trim(), v.size);
      return `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td>${esc(v.size)}</td>
        <td class="num" style="color:#B94A3D; font-weight:700;">${v.qty}</td>
        <td class="num">${p.minQty}</td>
        <td>${order ? ('&#128722; ສັ່ງຊື້ແລ້ວ ('+sumPendingOrderQty((p.code||'').trim(), v.size)+')') : '-'}</td>
      </tr>
    `;
    }).join('') || `<tr><td colspan="7" style="text-align:center; color:#888;">ບໍ່ມີສິນຄ້າໃກ້ໝົດ</td></tr>`;
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການໃກ້ໝົດ</span><b>${lowRows.length}</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th>ຂະໜາດ</th><th class="num">ຄົງເຫຼືອ</th><th class="num">ຂັ້ນຕ່ຳ</th><th>ສະຖານະສັ່ງຊື້</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } else if(kind === 'fullstock'){
    title = 'ລາຍງານຈຳນວນສິນຄ້າຄົງຄັງ';
    const rows = [];
    [...list].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      p.variants.forEach(v => { if(v.qty > 0) rows.push({p,v}); });
    });
    const trs = rows.map(({p,v}, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td>${esc(v.size)}</td>
        <td class="num">${v.qty}</td>
        <td>${esc(p.unit)}</td>
      </tr>

    const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການ</span><b>${rows.length}</b></div>
        <div><span>ຈຳນວນລວມ</span><b>${totalQty} ລາຍການ</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th>ຂະໜາດ</th><th class="num">ຈຳນວນ</th><th>ໜ່ວຍ</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    `;
  } else if(kind === 'category'){
    const catLabel = reportCategoryFilter === '' ? 'ທັງໝົດ' : (reportCategoryFilter === '__none__' ? 'ບໍ່ໄດ້ກຳນົດ' : reportCategoryFilter);
    title = 'ລາຍງານຕາມໝວດໝູ່ສິນຄ້າ - ' + catLabel;
    const matches = p2 => reportCategoryFilter === '' ? true : (reportCategoryFilter === '__none__' ? !p2.category : p2.category === reportCategoryFilter);
    const rows = [];
    [...list].filter(matches).sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      p.variants.forEach(v => { rows.push({p,v}); });
    });
    const trs = rows.map(({p,v}, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td>${esc(v.size)}</td>
        <td class="num">${v.qty}</td>
        <td>${esc(p.unit)}</td>
      </tr>
    `).join('') || `<tr><td colspan="6" style="text-align:center; color:#888;">ບໍ່ມີສິນຄ້າໃນໝວດໝູ່ນີ້</td></tr>`;
    const skuCount = new Set(rows.map(r=>r.p.id)).size;
    const totalQty = rows.reduce((s,r)=>s+r.v.qty, 0);
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການ</span><b>${skuCount}</b></div>
        <div><span>ຈຳນວນລວມ</span><b>${totalQty} ລາຍການ</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th>ຂະໜາດ</th><th class="num">ຈຳນວນ</th><th>ໜ່ວຍ</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    `;
  } else {
    return;
  }

  const printArea = document.getElementById('print-area');
  printArea.innerHTML = `
    <div class="print-header">
      ${logoImg ? `<img src="${logoImg}" class="print-logo">` : ''}
      <div>
        <h1>ຄັງເສື້ອຜ້າ</h1>
        <p>${esc(title)}</p>
        <p class="print-date">ສ້າງເມື່ອ: ${esc(now)}</p>
      </div>
    </div>
    ${bodyHtml}
  `;
  setTimeout(() => { window.print(); }, 50);
}

    name: p.name,
    code: '',
    unit: p.unit || 'ລາຍການ',
    price: String(p.price),
    minQty: String(p.minQty),
    category: p.category || '',
    image: p.image || null,

function openEdit(id){

}

function renderVariants(){
  const container = document.getElementById('variants-container');
  container.innerHTML = formState.variants.map(v => {
    const known = SIZE_OPTIONS.includes(v.size);
    const extraOpt = (v.size && !known) ? `<option value="${esc(v.size)}" selected>${esc(v.size)}</option>` : '';
    const opts = `<option value="">-- ຂະໜາດ --</option>` + extraOpt + SIZE_OPTIONS.map(s => `<option value="${esc(s)}" ${v.size===s?'selected':''}>${esc(s)}</option>`).join('');
    return `
    <div class="vrow" data-vid="${v.id}">
      <select data-vfield="size">${opts}</select>
      <input type="number" inputmode="numeric" value="${esc(v.qty)}" data-vfield="qty" placeholder="ຈຳນວນ">
      <button type="button" data-remove-variant="${v.id}" ${formState.variants.length<=1?'disabled':''}>${ICONS.trash}</button>
    </div>
  `;
  }).join('');

  container.querySelectorAll('.vrow').forEach(row=>{
    const vid = row.dataset.vid;
    row.querySelector('[data-vfield="size"]').addEventListener('change', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.size = e.target.value;
    });
    row.querySelector('[data-vfield="qty"]').addEventListener('input', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.qty = e.target.value;
    });
  });
  container.querySelectorAll('[data-remove-variant]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(formState.variants.length<=1) return;
      formState.variants = formState.variants.filter(v=>v.id!==btn.dataset.removeVariant);
      renderVariants();
    });
  });
}

function addSizeRow(size){
  if(size && formState.variants.some(v=>v.size.toLowerCase()===size.toLowerCase())) return;
  formState.variants.push({ id:uid(), size, qty:'' });
  renderVariants();
}

function handleImagePick(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  resizeImage(file).then(dataUrl=>{
    formState.image = dataUrl;
    renderModal();
  }).catch(()=>{ showToast('ເລືອກຮູບບໍ່ສຳເລັດ'); });
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleSubmit(e){
  e.preventDefault();
  const f = formState;
  const errorEl = document.getElementById('form-error');
  if(errorEl){ errorEl.style.display = 'none'; errorEl.textContent = ''; }
  if(!f.name.trim()) return;
  const price = Math.max(0, parseFloat(f.price) || 0);
  const minQty = Math.max(0, parseInt(f.minQty,10) || 0);
  const variants = f.variants
    .filter(v => v.size.trim() !== '' || f.variants.length === 1)
    .map(v => ({ id:v.id, size: v.size.trim() || 'ບໍລິການອື່ນ', qty: Math.max(0, parseInt(v.qty,10) || 0) }));

  const codeTrim = f.code.trim();
  if(codeTrim){
    const codeClash = products.some(p => p.id !== f.id && (p.code||'').trim().toLowerCase() === codeTrim.toLowerCase());
    if(codeClash){
      if(errorEl){ errorEl.textContent = 'ລະຫັດສິນຄ້າ "' + codeTrim + '" ມີຢູ່ແລ້ວ, ກະລຸນາປ່ຽນ ຫຼື ປ່ອຍຫວ່າງ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const nameTrim = f.name.trim().toLowerCase();
  const relatedProducts = products.filter(p => p.id !== f.id && p.name.trim().toLowerCase() === nameTrim);
  for(const v of variants){
    const sizeTrim = v.size.trim().toLowerCase();
    const clashProduct = relatedProducts.find(p => p.variants.some(rv => rv.size.trim().toLowerCase() === sizeTrim));
    if(clashProduct){
      if(errorEl){ errorEl.textContent = 'ຂະໜາດ "' + v.size + '" ຊ້ຳກັບສິນຄ້າ "' + clashProduct.name + '" ແລ້ວ (ຊື່ດຽວກັນ), ກະລຸນາປ່ຽນເປັນຂະໜາດອື່ນ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const payload = { name:f.name.trim(), code:codeTrim, unit:f.unit||'ລາຍການ', price, minQty, category:f.category||'', image:f.image, variants };

  if(f.id){
    products = products.map(p => p.id===f.id ? { ...p, ...payload } : p);
    showToast('ແກ້ໄຂສິນຄ້າແລ້ວ');
  } else {
    products = [{ id: Date.now().toString(), ...payload }, ...products];
    showToast('ເພີ່ມສິນຄ້າແລ້ວ');
  }
  save();
  closeModal();
  renderAll();
}

/* ---------- GOOGLE DRIVE SYNC ---------- */
const GDRIVE_CLIENT_ID_KEY = 'khang-sinkha-gdrive-client-id';
const GDRIVE_FILE_ID_KEY = 'khang-sinkha-gdrive-file-id';
const GDRIVE_CONNECTED_KEY = 'khang-sinkha-gdrive-connected';
const GDRIVE_LAST_SYNC_KEY = 'khang-sinkha-gdrive-last-sync';
const DRIVE_FILE_NAME = 'khang-sinkha-backup.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const SHEET_ID_KEY = 'khang-sinkha-sheet-id';
const SHEET_LAST_SYNC_KEY = 'khang-sinkha-sheet-last-sync';
const SHEET_TITLE = 'khang-sinkha-barcode-log';

let tokenClient = null;
let gdriveToken = null;
let syncDebounceTimer = null;

function getClientId(){ return localStorage.getItem(GDRIVE_CLIENT_ID_KEY) || ''; }

function loadGsiScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('gsi load failed'));
    document.head.appendChild(s);
  });
}

function connectDrive(promptMode){
  const clientId = getClientId();
  if(!clientId){ showToast('ກະລຸນາໃສ່ Google Client ID ກ່ອນ'); return Promise.resolve(false); }
  return loadGsiScript().then(()=> new Promise((resolve)=>{
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if(resp && resp.access_token){
            gdriveToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in*1000 - 60000) };
            localStorage.setItem(GDRIVE_CONNECTED_KEY, '1');
            resolve(true);
          } else resolve(false);
        },
        error_callback: () => resolve(false)
      });
      tokenClient.requestAccessToken({ prompt: promptMode === undefined ? '' : promptMode });
    }catch(e){ resolve(false); }
  })).catch(()=>{ showToast('ໂຫຼດ Google SDK ບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດ'); return false; });
}

function isDriveConnected(){ return !!(gdriveToken && gdriveToken.expires_at > Date.now()); }

async function ensureToken(){
  if(isDriveConnected()) return true;
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return false;
  return await connectDrive('none');
}

async function driveRequest(url, options){
  const ok = await ensureToken();
  if(!ok) throw new Error('no-auth');
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + gdriveToken.access_token });
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text(); throw new Error('drive-error: '+res.status+' '+t); }
  return res;
}

async function findDriveFileId(){
  let fileId = localStorage.getItem(GDRIVE_FILE_ID_KEY);
  if(fileId) return fileId;
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const data = await res.json();
  if(data.files && data.files.length){
    fileId = data.files[0].id;
    localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    return fileId;
  }
  return null;
}

async function findOrCreateSheet(){
  let sheetId = localStorage.getItem(SHEET_ID_KEY);
  if(sheetId) return sheetId;
  const q = encodeURIComponent(`name='${SHEET_TITLE}' and trashed=false and mimeType='application/vnd.google-apps.spreadsheet'`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length){
    sheetId = data.files[0].id;
    localStorage.setItem(SHEET_ID_KEY, sheetId);
    return sheetId;
  }
  const createRes = await driveRequest('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ properties:{ title: SHEET_TITLE }, sheets:[{ properties:{ title:'Log' } }] })
  });
  const createData = await createRes.json();
  sheetId = createData.spreadsheetId;
  localStorage.setItem(SHEET_ID_KEY, sheetId);
  await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A1:B1?valueInputOption=RAW`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ values:[['ລະຫັດ Barcode','ວັນທີ-ເວລາ ຮັບເຂົ້າ']] })
  });
  return sheetId;
}

async function syncScanLogToSheet(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){
      ok = await connectDrive('');
    }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google'); return; }
    const sheetId = await findOrCreateSheet();
    const unsynced = scanLog.filter(r=>!r.syncedToSheet);
    if(unsynced.length === 0){ if(!silent) showToast('ບໍ່ມີລາຍການໃໝ່ໃຫ້ sync'); return; }
    const rows = unsynced.map(r => [r.code, new Date(r.scannedAt).toLocaleString('lo-LA')]);
    await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A:B:append?valueInputOption=RAW`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ values: rows })
    });
    const unsyncedIds = new Set(unsynced.map(r=>r.id));
    scanLog = scanLog.map(r => unsyncedIds.has(r.id) ? { ...r, syncedToSheet:true } : r);
    saveScanLog();
    localStorage.setItem(SHEET_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('ສົ່ງອອກ Log ໄປ Google Sheet ສຳເລັດ (' + unsynced.length + ' ລາຍການ)');
    if(tab === 'barcode') renderBarcodeTab();
  }catch(e){
    if(!silent) showToast('ສົ່ງອອກບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncToDrive(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){ ok = await connectDrive(''); }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive, ກະລຸນາລອງໃໝ່'); return; }
    let fileId = await findDriveFileId();
    const payload = JSON.stringify({ app:'khang-sinkha', version:2, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog });
    if(!fileId){
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = '-------khangsinkha' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      const data = await res.json();
      fileId = data.id;
      localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    } else {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method:'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
    }
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('Sync ຂຶ້ນ Google Drive ສຳເລັດ');
    if(document.getElementById('backup-overlay')) renderBackupModal();
  } catch(e){
    if(!silent) showToast('Sync ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncFromDrive(){
  try{
    let ok = await ensureToken();
    if(!ok){ ok = await connectDrive(''); }
    if(!ok){ showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive, ກະລຸນາລອງໃໝ່'); return; }
    const fileId = await findDriveFileId();
    if(!fileId){ showToast('ຍັງບໍ່ມີໄຟລ໌ສຳຮອງໃນ Drive'); return; }
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) throw new Error('bad format');
    pendingImportData = {
      products:list,
      logo: Array.isArray(parsed) ? null : (parsed.logo || null),
      cover: Array.isArray(parsed) ? null : (parsed.cover || null),
      categories: Array.isArray(parsed) ? null : (Array.isArray(parsed.categories) ? parsed.categories : null),
      customerOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.customerOrders) ? parsed.customerOrders : null),
      purchaseOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.purchaseOrders) ? parsed.purchaseOrders : null),
      scanLog: Array.isArray(parsed) ? null : (Array.isArray(parsed.scanLog) ? parsed.scanLog : null)
    };
    renderImportConfirm();
  } catch(e){
    showToast('ດຶງຂໍ້ມູນຈາກ Drive ບໍ່ສຳເລັດ');
  }
}

function disconnectDrive(){
  gdriveToken = null;
  localStorage.removeItem(GDRIVE_CONNECTED_KEY);
  localStorage.removeItem(GDRIVE_FILE_ID_KEY);
  showToast('ຍົກເລີກການເຊື່ອມຕໍ່ Google Drive ແລ້ວ');
  renderBackupModal();
}

function scheduleAutoSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(()=>{ syncToDrive(true); }, 2500);
}

function exportData(){
  const payload = { app:'khang-sinkha', version:2, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'khang-sinkha-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
  renderBackupModal();
  showToast('ດາວໂຫຼດໄຟລ໌ສຳຮອງແລ້ວ');
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : parsed.products;
      if(!Array.isArray(list)) throw new Error('bad format');
      const valid = list.every(p => p && typeof p.name === 'string');
      if(!valid) throw new Error('bad format');
      pendingImportData = {
        products:list,
        logo: Array.isArray(parsed) ? null : (parsed.logo || null),
        cover: Array.isArray(parsed) ? null : (parsed.cover || null),
        categories: Array.isArray(parsed) ? null : (Array.isArray(parsed.categories) ? parsed.categories : null),
        customerOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.customerOrders) ? parsed.customerOrders : null),
        purchaseOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.purchaseOrders) ? parsed.purchaseOrders : null),
        scanLog: Array.isArray(parsed) ? null : (Array.isArray(parsed.scanLog) ? parsed.scanLog : null)
      };
      renderImportConfirm();
    }catch(err){
      showToast('ໄຟລ໌ບໍ່ຖືກຕ້ອງ, ບໍ່ສາມາດນຳເຂົ້າໄດ້');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

  if(Array.isArray(pendingImportData.customerOrders)) extraParts.push('ບິນສັ່ງຊື້ລູກຄ້າ ' + pendingImportData.customerOrders.length + ' ລາຍການ');
  if(Array.isArray(pendingImportData.purchaseOrders)) extraParts.push('ລາຍການຈັດຊື້ ' + pendingImportData.purchaseOrders.length + ' ລາຍການ');
  if(Array.isArray(pendingImportData.scanLog)) extraParts.push('ປະຫວັດສະແກນ ' + pendingImportData.scanLog.length + ' ລາຍການ');
  const extraNote = extraParts.length ? (', ' + extraParts.join(', ')) : '';
  root.innerHTML = `
    <div class="overlay center" id="import-overlay">
      <div class="confirm-box">
        <p class="title">ນຳເຂົ້າຂໍ້ມູນ?</p>
        <p class="desc">ພົບ ${pendingImportData.products.length} ລາຍການສິນຄ້າໃນໄຟລ໌ສຳຮອງ${brandNote}${extraNote}. ການນຳເຂົ້າຈະທັບຂໍ້ມູນປັດຈຸບັນທັງໝົດ ແລະ ບໍ່ສາມາດກູ້ຄືນໄດ້.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="import-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="import-ok-btn">ນຳເຂົ້າ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('import-overlay').addEventListener('click', e=>{ if(e.target.id==='import-overlay'){ pendingImportData=null; root.innerHTML=''; }});
  document.getElementById('import-cancel-btn').addEventListener('click', ()=>{ pendingImportData=null; root.innerHTML=''; });
  document.getElementById('import-ok-btn').addEventListener('click', ()=>{
    products = pendingImportData.products.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ບໍລິການອື່ນ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ບໍລິການອື່ນ', qty:0 }]
    }));
    if(pendingImportData.logo){ logoImg = pendingImportData.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(pendingImportData.cover){ coverImg = pendingImportData.cover; localStorage.setItem(COVER_KEY, coverImg); }
    if(Array.isArray(pendingImportData.categories)){ CATEGORIES = pendingImportData.categories; localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }
    if(Array.isArray(pendingImportData.customerOrders)){ customerOrders = pendingImportData.customerOrders; localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }
    if(Array.isArray(pendingImportData.purchaseOrders)){ purchaseOrders = pendingImportData.purchaseOrders; localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }
    if(Array.isArray(pendingImportData.scanLog)){ scanLog = pendingImportData.scanLog; localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }
    save();
    pendingImportData = null;
    root.innerHTML = '';
    closeBackupModal();
    renderAll();
    showToast('ນຳເຂົ້າຂໍ້ມູນສຳເລັດ');
  });
}

function copyProductCode(id){
  const p = products.find(x => x.id === id);
  if(!p || !p.code) return;
  const code = p.code;
  const done = ()=> showToast('ກ໋ອບປີ້ລະຫັດ ' + code + ' ແລ້ວ');
  const fail = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('ກ໋ອບປີ້ບໍ່ສຳເລັດ'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(fail);
  } else {
    fail();
  }
}

/* ---------- ACTIONS (delegated) ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action === 'toggle-expand'){
    expanded[id] = !expanded[id];
    if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
    else { renderListItems(); }
  } else if(action === 'open-category'){
    openCategoryDetail(t.dataset.cat);
  } else if(action === 'open-detail'){
    openDetail(id);
  } else if(action === 'duplicate-product'){
    openDuplicate(id);
  } else if(action === 'copy-code'){
    e.stopPropagation();
    copyProductCode(id);
  } else if(action === 'open-cart'){
    e.stopPropagation();
    if(revealedCartId !== id){
      /* ຄັ້ງທຳອິດ: ພຽງແຕ່ກາງປຸ່ມກະຕ່າອອກມາ, ຍັງບໍ່ເປີດ popup */
      revealedCartId = id;
      if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
      else { renderListItems(); }
    } else {
      openCartModal(id);
    }
  } else if(action === 'open-addcart'){
    e.stopPropagation();
    if(revealedCartId === id) openAddCartModal(id);
  } else if(action === 'edit-order'){
    openEditOrderModal(id);
  } else if(action === 'accept-order'){
    acceptOrder(id);
  } else if(action === 'delete-order'){
    confirmDeleteOrder(id);
  } else if(action === 'open-sell'){
    openSellModal(id);
  } else if(action === 'open-buy'){
    openBuyModal(id);
  } else if(action === 'open-edit'){
    openEdit(id);
  } else if(action === 'confirm-delete'){
    confirmDelete(id);
  } else if(action === 'adjust-variant'){
    const vid = t.dataset.vid;
    const delta = parseInt(t.dataset.delta, 10);
    products = products.map(p => p.id===id ? { ...p, variants: p.variants.map(v => v.id===vid ? {...v, qty: Math.max(0, v.qty+delta)} : v) } : p);
    save();
    renderAll();
    if(detailId === id) renderDetailSheet();
  } else if(action === 'delete-scan'){
    const scanId = t.dataset.scanId;
    scanLog = scanLog.filter(r=>r.id!==scanId);
    saveScanLog();
    renderBarcodeList();
  }
});

/* ---------- ປຸ່ມໂລໂກ້ຮ້ານ: ສະແດງຍອດຂາຍລວມທຸກບິນປະຈຳວັນ (pop up ໂຕໜັງສືລ້ວນໆ, ບໍ່ມີກ່ອງພື້ນຫຼັງ) ---------- */
(function setupDailyTotalBtn(){
  const btn = document.getElementById('daily-total-btn');
  if(!btn) return;
  btn.innerHTML = `<img src="${STORE_LOGO}" alt="ຍອດຂາຍລວມມື້ນີ້">`;
  btn.addEventListener('click', ()=>{
    /* ໜ້າ "ລາຍງານ" ຍັງບໍ່ໃຫ້ປຸ່ມນີ້ຮັບຄຳສັ່ງໃດໆເທື່ອ (ຈະໃສ່ຄຳສັ່ງອື່ນຕາມຫຼັງ) —ສະແດງແຕ່ຂໍ້ຄວາມ "ກຳລັງພັດທະນາ" */
    if(tab === 'report'){ showToast('ກຳລັງພັດທະນາ'); return; }
    openDailyTotalModal();
  });
})();

function getTodayTotalSales(){
  const targetDate = ordersFilterDate || new Date().toISOString().slice(0,10);
  return customerOrders
    .filter(o => (o.createdAt || '').slice(0,10) === targetDate)
    .reduce((s,o) => s + getOrderTotal(o), 0);
}

function openDailyTotalModal(){
  const root = document.getElementById('daily-total-root');
  if(!root) return;
  const total = getTodayTotalSales();
  const targetDate = ordersFilterDate || new Date().toISOString().slice(0,10);
  const isToday = targetDate === new Date().toISOString().slice(0,10);
  const dateObj = new Date(targetDate + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('lo-LA', { day:'2-digit', month:'2-digit', year:'numeric' });
  const caption = isToday ? 'ຍອດຂາຍລວມມື້ນີ້' : `ຍອດຂາຍລວມວັນທີ ${dateLabel}`;
  const sparkCount = 12;
  const radius = 118;
  const sparks = Array.from({length:sparkCount}).map((_,i) => {
    const angle = (360 / sparkCount) * i;
    const size = 14 + (i % 3) * 6;
    const delay = (i * 0.12).toFixed(2);
    return `<div class="daily-total-spark-wrap" style="transform:rotate(${angle}deg) translate(${radius}px) rotate(${-angle}deg);"><span class="daily-total-spark" style="font-size:${size}px; animation-delay:${delay}s;">✦</span></div>`;
  }).join('');
  root.innerHTML = `
    <div class="daily-total-overlay" id="daily-total-overlay">
      <div class="daily-total-burst">
        <div class="daily-total-ring">${sparks}</div>
        <div class="daily-total-text">
          <span class="caption">${caption}</span>
          <span class="amount">${total.toLocaleString()}</span>
          <span class="unit">ກີບ</span>
        </div>
      </div>
    </div>
  `;
  document.getElementById('daily-total-overlay').addEventListener('click', closeDailyTotalModal);
}
function closeDailyTotalModal(){
  const root = document.getElementById('daily-total-root');
  if(root) root.innerHTML = '';
}

/* ---------- PWA: service worker + install prompt ---------- */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const b = document.getElementById('install-banner-root');
  if(b) b.innerHTML = '';
});

function showInstallBanner(){
  if(document.getElementById('install-banner')) return;
  const root = document.getElementById('install-banner-root');
  root.innerHTML = `
    <div id="install-banner" style="position:sticky; top:0; z-index:5; background:var(--accent); color:var(--dark); display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:12px; font-weight:600;">
      <span style="flex:1;">ຕິດຕັ້ງແອັບນີ້ໃສ່ໜ້າຈໍຫຼັກໄດ້ເລີຍ</span>
      <button id="install-btn" style="background:var(--dark); color:#fff; border:none; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ຕິດຕັ້ງ</button>
      <button id="install-dismiss-btn" style="background:none; border:none; cursor:pointer; padding:4px; color:var(--dark);">${ICONS.x}</button>
    </div>
  `;
  document.getElementById('install-btn').addEventListener('click', async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    root.innerHTML = '';
  });
  document.getElementById('install-dismiss-btn').addEventListener('click', ()=>{ root.innerHTML=''; });
}

async function autoPullOnLoad(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY) || location.protocol === 'file:') return;
    const ok = await ensureToken();
    if(!ok) return;
    const fileId = await findDriveFileId();
    if(!fileId) return;
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const remoteTime = parsed.exportedAt ? new Date(parsed.exportedAt).getTime() : 0;
    const lastSyncStr = localStorage.getItem(GDRIVE_LAST_SYNC_KEY);
    const localSyncTime = lastSyncStr ? new Date(lastSyncStr).getTime() : 0;
    if(!remoteTime || remoteTime <= localSyncTime) return;

    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) return;

    products = list.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ບໍລິການອື່ນ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ບໍລິການອື່ນ', qty:0 }]
    }));
    if(parsed.logo){ logoImg = parsed.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(parsed.cover){ coverImg = parsed.cover; localStorage.setItem(COVER_KEY, coverImg); }
    if(Array.isArray(parsed.categories)){ CATEGORIES = parsed.categories; localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }
    if(Array.isArray(parsed.customerOrders)){ customerOrders = parsed.customerOrders; localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }
    if(Array.isArray(parsed.purchaseOrders)){ purchaseOrders = parsed.purchaseOrders; localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }
    if(Array.isArray(parsed.scanLog)){ scanLog = parsed.scanLog; localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, parsed.exportedAt);
    renderAll();
    showToast('ດຶງຂໍ້ມູນລ່າສຸດຈາກ Drive ອັດຕະໂນມັດແລ້ວ');
  }catch(e){ /* best-effort background refresh, ignore failures */ }
}

if(localStorage.getItem(GDRIVE_CONNECTED_KEY) && location.protocol !== 'file:'){
  autoPullOnLoad();
}

/* ---------- UNIVERSAL CLEAR (×) BUTTON FOR TEXT/NUMBER INPUT FIELDS ---------- */
/* ອັດຕະໂນມັດເພີ່ມປຸ່ມ × (ວົງມົນສີແດງ) ໃສ່ຊ່ອງພິມທີ່ແກ້ໄຂໄດ້ທົ່ວແອັບ ເພື່ອລຶບຂໍ້ມູນທັງໝົດໃນຊ່ອງນັ້ນທັນທີ */
/* ຍົກເວັ້ນ: ຊ່ອງຈຳນວນແບບ stepper (ຄັບແຄບ, ພິມສັ້ນ), ຊ່ອງວັນທີ, ຊ່ອງໄຟລ໌, ແລະ ຊ່ອງທີ່ຈັດການເອງແລ້ວ (search-input) */
const CLEARABLE_INPUT_TYPES = ['text', 'tel', 'number', 'email', 'search', ''];
const NO_CLEAR_IDS = ['quick-scan-qty', 'po-qty', 'orders-date-input'];
function shouldSkipClearableInput(inp){
  if(inp.dataset.noClear) return true;
  if(NO_CLEAR_IDS.indexOf(inp.id) !== -1) return true;
  if(inp.className && inp.className.indexOf('qty-input') !== -1) return true;
  if(inp.closest('.vrow')) return true;
  const type = (inp.getAttribute('type') || 'text').toLowerCase();
  return CLEARABLE_INPUT_TYPES.indexOf(type) === -1;
}
function initClearableInputs(root){
  const scope = root || document;
  if(!scope.querySelectorAll) return;
  scope.querySelectorAll('input').forEach(inp=>{
    if(inp.dataset.clearInit) return;
    inp.dataset.clearInit = '1';
    if(shouldSkipClearableInput(inp)) return;
    const parent = inp.parentNode;
    if(!parent) return;
    const wrap = document.createElement('span');
    wrap.className = 'clear-input-wrap';
    const parentDisplay = getComputedStyle(parent).display;
    if(parentDisplay.indexOf('flex') !== -1){
      const inpFlex = getComputedStyle(inp).flex;
      wrap.style.display = 'flex';
      wrap.style.alignItems = 'center';
      wrap.style.flex = (inpFlex && inpFlex !== '0 1 auto') ? inpFlex : '1 1 auto';
      wrap.style.minWidth = '0';
    } else {
      wrap.style.display = 'block';
    }
    parent.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'clear-input-btn';
    btn.textContent = '✕';
    btn.setAttribute('aria-label', 'ລຶບຂໍ້ມູນ');
    wrap.appendChild(btn);
    const toggle = () => { btn.style.display = inp.value ? 'flex' : 'none'; };
    toggle();
    inp.addEventListener('input', toggle);
    btn.addEventListener('mousedown', e=>{ e.preventDefault(); });
    btn.addEventListener('click', ()=>{
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles:true }));
      inp.dispatchEvent(new Event('change', { bubbles:true }));
      inp.focus();
      toggle();
    });
  });
}
let clearableInputsScanQueued = false;
function queueClearableInputsScan(){
  if(clearableInputsScanQueued) return;
  clearableInputsScanQueued = true;
  requestAnimationFrame(()=>{ clearableInputsScanQueued = false; initClearableInputs(document); });
}
initClearableInputs(document);
new MutationObserver(queueClearableInputsScan).observe(document.body, { childList:true, subtree:true });
</script>
